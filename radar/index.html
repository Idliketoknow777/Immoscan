<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Radar immobilier — Portail</title>
<!--
  Portail du Radar immobilier — page /radar/ (module M7, format 1 de donnees.json).
  Coquille publique (décision 1-C, 29 sept. 2026) : AUCUNE donnée dans ce fichier.
  Après connexion Google, la page lit donnees.json et journal_runs.json dans le Drive
  (« Radar immobilier / 03 - Donnees machine ») — lecture seule, jamais d'écriture.
  Partage d'une fiche : image dessinée dans la page + copie du Cruncher lue dans le Drive (lecture seule).
  Aucun calcul : la page affiche ce que le Cruncher et assembler.py ont produit.
  Contrat de données : CHANTIER_Portail_Premiere_Carte.md §5.
-->
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--pos:#0f7b4b;--posbg:#e6f4ec;--neg:#b42318;--negbg:#fdecea;--acc:#2446a8;--warn:#8a5a00;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:1200px;margin:auto}
h1{font-size:19px;margin:0}.sub{color:var(--mute);font-size:13px}
/* Numéro de version : augmenter à CHAQUE publication de cette page (bêta 0.1, 0.2, …). */
.ver{font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:3px;letter-spacing:.02em}
.etat{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--mute);border:0;font-family:inherit;cursor:pointer}
.etat.ok{background:var(--posbg);color:var(--pos)}.etat.ko{background:var(--negbg);color:var(--neg)}
.barre{display:flex;gap:8px;flex-wrap:wrap;max-width:1200px;margin:10px auto 0}
.barre select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);flex:1 1 0;min-width:0;max-width:340px;text-overflow:ellipsis}
.etat .ct{display:none}
.partage{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--acc);border-radius:8px;background:var(--acc);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;white-space:nowrap}
.partage svg{width:15px;height:15px;flex:0 0 auto}
.kpis{display:flex;gap:10px;flex-wrap:wrap;max-width:1200px;margin:16px auto 0;padding:0 16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px;flex:1 1 120px}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mute)}.kpi.off{opacity:.5}
main{max-width:1200px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px}
.carte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tag{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.adr{font-weight:650;font-size:16px;margin:0}.meta{color:var(--mute);font-size:13px}
.prix{display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:6px}
.prix>div{background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.prix .l{font-size:11px;color:var(--mute)}.prix .v{font-size:17px;font-weight:700;white-space:nowrap}
.prix .v.s{font-size:15px}.prix .r{font-size:11px;color:var(--mute)}
table.abc{width:100%;border-collapse:separate;border-spacing:4px 0;table-layout:fixed}
.abc th{font-size:11px;color:var(--mute);font-weight:500;text-align:center;padding-bottom:2px}
.abc td{text-align:center;white-space:nowrap}
.abc .val td{font-weight:650;font-size:14.5px;padding:4px 0}
.abc .ec td{padding:6px 2px;border-radius:8px}
.abc .ec .l{display:block;font-size:10.5px;color:var(--mute);white-space:normal;line-height:1.2}
.abc .ec b{font-size:15px}
.pos{background:var(--posbg)}.pos b{color:var(--pos)}.neg{background:var(--negbg)}.neg b{color:var(--neg)}
ul.mf{margin:0;padding-left:18px;font-size:13px}ul.mf li{margin:2px 0}
.chk{display:inline-block;width:15px;height:15px;border:1.5px solid var(--mute);border-radius:4px;vertical-align:-2px;margin-left:4px;opacity:.6}
.bas{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{text-decoration:none;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--acc);color:var(--acc);background:#fff;font-family:inherit;cursor:pointer}
.btn.p{background:var(--acc);color:#fff}.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.score{margin-left:auto;font-size:12px;color:var(--mute)}
details{font-size:13px}summary{cursor:pointer;color:var(--acc)}
table.det{width:100%;border-collapse:collapse;margin-top:6px}
.det td,.det th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right;font-weight:400}
.det td:first-child,.det th:first-child{text-align:left}.det th{color:var(--mute);font-size:12px}
.det-plan{width:100%;height:180px;border:0;border-radius:8px;margin-top:8px}
.flag{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 8px;margin:6px 0 0}
.accueil{max-width:520px;margin:48px auto;padding:24px 16px;text-align:center;grid-column:1/-1}
.accueil p{color:var(--mute)}
.lienb{background:none;border:0;padding:6px;color:var(--mute);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.panneau{max-width:1200px;margin:12px auto 0;padding:0 16px}
.panneau .boite{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.panneau .run{border-bottom:1px solid var(--line);padding:8px 0}.panneau .run:last-child{border:0}
.panneau pre{white-space:pre-wrap;margin:4px 0 0;font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--mute)}
.note{max-width:1200px;margin:0 auto 24px;padding:0 16px;color:var(--mute);font-size:12px}
dialog.pp{border:0;border-radius:14px;padding:16px;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;color:var(--ink);font:inherit;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog.pp::backdrop{background:rgba(20,25,35,.45)}
.pp h2{font-size:16px;margin:0 0 10px}
.pp .ap{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.pp .ap img{width:100%;display:block}
.pp label{display:flex;gap:8px;align-items:center;font-size:14px;margin:12px 0 0;cursor:pointer}
.pp input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;accent-color:var(--acc)}
.pp .st{font-size:12.5px;color:var(--mute);min-height:36px;margin:10px 0}
.pp .act{display:flex;gap:8px;justify-content:flex-end}
.pp .btn{padding:9px 16px;font-size:14px}.btn:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
@media (max-width:420px){.prix{grid-template-columns:1fr 1fr}.prix>div:first-child{grid-column:1/-1}}
/* Téléphone : en-tête réduit à deux lignes (titre + dernier run, puis tri + secteur côte à côte). */
@media (max-width:600px){
 header{padding:6px 12px}.top{flex-wrap:nowrap;gap:8px}
 h1{font-size:16px;white-space:nowrap}h1 .lg,.sub,.etat .lg{display:none}.etat .ct{display:inline}
 .etat{font-size:12px;padding:3px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
 .barre{margin-top:6px;gap:6px;flex-wrap:nowrap}.barre select{max-width:none;padding:5px 8px}.partage{padding:5px 10px}.partage span{display:none}
 .kpis{margin-top:8px;gap:6px;flex-wrap:nowrap}.kpi.off{display:none}
 .kpi{display:flex;align-items:baseline;gap:6px;padding:4px 10px;min-width:0;flex:1 1 0;white-space:nowrap;overflow:hidden}
 .kpi b{display:inline;font-size:15px}main{margin-top:8px}
}
</style>
</head>
<body>
<header>
 <div class="top">
  <div><h1>Radar immobilier<span class="lg"> — Portail</span><span class="ver" title="Version de cette page">bêta 0.1</span></h1><div class="sub" id="sous-titre">Connexion requise</div></div>
  <button class="etat" id="etat" type="button" hidden></button>
 </div>
 <div class="barre" id="barre" hidden>
  <select id="tri" aria-label="Trier">
   <option value="ecartC">Trier : écart C ↓ (potentiel)</option>
   <option value="ecartA">Écart A ↓ (plus petit écart à négocier)</option>
   <option value="ppp">Prix par porte ↑</option>
   <option value="recent">Plus récents</option>
  </select>
  <select id="secteur" aria-label="Secteur"><option value="">Tous les secteurs</option></select>
  <button class="partage" id="btn-partager" type="button" aria-label="Partager l'aperçu du Radar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span id="txt-partager">Partager</span></button>
 </div>
</header>

<section class="panneau" id="panneau-journal" hidden><div class="boite" id="journal"></div></section>
<section class="kpis" id="kpis" hidden></section>

<main id="grille">
 <div class="accueil" id="accueil">
  <p id="message">Les données du Radar sont dans ton Google Drive. Connecte-toi pour les afficher.</p>
  <button class="btn p" id="btn-connexion" type="button">Se connecter avec Google</button>
  <p><button class="lienb" id="btn-autre-compte" type="button" hidden>Utiliser un autre compte</button></p>
 </div>
</main>
<p class="note" id="pied" hidden></p>

<dialog class="pp" id="pp" aria-labelledby="pp-titre">
 <h2 id="pp-titre">Partager</h2>
 <div class="ap"><img id="pp-apercu" alt="Aperçu de la fiche qui sera envoyée"></div>
 <label id="pp-l-notes" hidden><input type="checkbox" id="pp-notes" checked> Joindre mes notes</label>
 <label id="pp-l-cr"><input type="checkbox" id="pp-cr" checked> Joindre une copie du Cruncher (fichier Excel)</label>
 <div class="st" id="pp-etat" aria-live="polite"></div>
 <div class="act"><button class="btn" id="pp-annuler" type="button">Annuler</button><button class="btn" id="pp-telecharger" type="button" hidden>Télécharger le Cruncher</button><button class="btn p" id="pp-envoyer" type="button" disabled>Envoyer</button></div>
</dialog>

<script>
"use strict";
// ---------------------------------------------------------------- réglages
// Identifiant client OAuth (étiquette publique, pas une clé — décision 1-C du 29 sept. 2026).
const CLIENT_ID = "970382559280-ohc88l54o2iigejropfleutrv2qkfjbf.apps.googleusercontent.com";
// Dossier « Radar immobilier / 03 - Donnees machine » (Drive de François).
const DOSSIER_DONNEES = "1pW-gd80-oXDWSr4lIMp8Oswp1bcjza1L";
const NOM_DONNEES = "donnees.json";
const NOM_JOURNAL = "journal_runs.json";
const PORTEE = "https://www.googleapis.com/auth/drive.readonly";
const FORMATS_CONNUS = ["1"];
// Lien envoyé par le bouton « Partager » : l'aperçu invité (lecture seule, sans connexion Google).
// Le lien du portail lui-même ne montrerait rien à un invité : les données sont dans le Drive de François.
const LIEN_PARTAGE = "https://claude.ai/artifact/UuhXLBazej9v1EqTG7snNk";

// ---------------------------------------------------------------- état
let jeton = null, donnees = null, journal = null, clientJeton = null;
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- formatage (aucun calcul)
const nbFr = new Intl.NumberFormat("fr-CA", {maximumFractionDigits: 0});
const nb1 = new Intl.NumberFormat("fr-CA", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const estNb = (v) => typeof v === "number" && isFinite(v);
const $$ = (v) => estNb(v) ? nbFr.format(v) + " $" : "—";
const $mille = (v) => estNb(v) ? nbFr.format(Math.round(v / 1000) * 1000) + " $" : "—";
const signe$ = (v) => estNb(v) ? (v >= 0 ? "+" : "−") + nbFr.format(Math.abs(Math.round(v / 1000) * 1000)) + " $" : "—";
const pct = (v) => estNb(v) ? nb1.format(v * 100) + " %" : "—";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateCourte = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso);
  return isNaN(d) ? esc(iso) : d.toLocaleDateString("fr-CA", {day: "numeric", month: "short"});
};
const dateHeure = (iso) => {
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleDateString("fr-CA", {day: "numeric", month: "short"}) + ", "
    + d.toLocaleTimeString("fr-CA", {hour: "2-digit", minute: "2-digit"});
};
const aujourdhui = () => new Date().toLocaleDateString("en-CA");  // AAAA-MM-JJ, heure locale

// ---------------------------------------------------------------- connexion Google
function message(txt) { if (!$("message")) return; $("message").textContent = txt; $("accueil").hidden = false; }

// Rester connecté (chantier Portail, étape 2 — 7 oct. 2026). Sans serveur, Google ne remet à une page que des
// jetons d'une heure. Trois moyens, sans aucun droit nouveau :
//  1. le jeton est redemandé « en discret » 5 minutes avant l'échéance (une fenêtre Google s'ouvre et se referme
//     seule) ; si le navigateur bloque cette fenêtre, la demande part au prochain toucher de la page ;
//  2. l'adresse du compte est retenue dans le navigateur (ce n'est pas un secret) : Google ne redemande plus
//     de choisir le compte ;
//  3. au retour après expiration : un essai sans clic, sinon un seul bouton.
const CLE_JETON = "radar_jeton", CLE_COMPTE = "radar_compte";
const MARGE_RENOUV = 5 * 60000;
let expireA = 0, attenteJeton = null, minuterie = null, dernierEssai = 0, chargement = false;

function lireJetonMemorise() {
  try {
    const j = JSON.parse(sessionStorage.getItem(CLE_JETON) || "null");
    if (j && j.expire > Date.now() + 60000) { expireA = j.expire; return j.valeur; }
  } catch (e) {}
  return null;
}
function memoriserJeton(valeur, secondes) {
  expireA = Date.now() + secondes * 1000;
  try { sessionStorage.setItem(CLE_JETON, JSON.stringify({valeur, expire: expireA})); } catch (e) {}
}
function oublierJeton() { jeton = null; expireA = 0; clearTimeout(minuterie); try { sessionStorage.removeItem(CLE_JETON); } catch (e) {} }
function compteMemorise() { try { return localStorage.getItem(CLE_COMPTE) || ""; } catch (e) { return ""; } }
function memoriserCompte(c) { try { if (c) localStorage.setItem(CLE_COMPTE, c); else localStorage.removeItem(CLE_COMPTE); } catch (e) {} }

function chargerGIS() {
  return new Promise((ok, ko) => {
    if (window.google && google.accounts && google.accounts.oauth2) return ok();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = ok; s.onerror = () => ko(new Error("Service de connexion Google injoignable."));
    document.head.appendChild(s);
  });
}

// Une seule demande à la fois. discret = renouvellement (on n'attend pas longtemps) ; choisir = changer de compte.
function demanderJeton(discret, choisir) {
  if (attenteJeton) return attenteJeton;
  dernierEssai = Date.now();
  const p = chargerGIS().then(() => new Promise((ok, ko) => {
    const compte = choisir ? "" : compteMemorise();
    let tardif = false;
    const garde = setTimeout(() => { tardif = true; ko(Object.assign(new Error("Google n'a pas répondu."), {type: "delai"})); }, discret ? 20000 : 180000);
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: PORTEE,
      callback: (r) => {
        clearTimeout(garde);
        if (r.error || !r.access_token) return ko(Object.assign(new Error("Connexion refusée ou annulée (" + (r.error || "sans jeton") + ")."), {type: "refus"}));
        jeton = r.access_token; memoriserJeton(jeton, Number(r.expires_in) || 3600); dernierEssai = 0; planifierRenouvellement(); ok(jeton);
        if (tardif && !donnees) charger();
      },
      error_callback: (e) => {
        clearTimeout(garde);
        const type = (e && e.type) || "fenetre";
        if (type === "popup_failed_to_open") dernierEssai = 0;   // bloquée : le prochain toucher réessaie tout de suite
        ko(Object.assign(new Error(type === "popup_failed_to_open" ? "Le navigateur a bloqué la fenêtre Google. Touche le bouton pour continuer."
          : type === "popup_closed" ? "Fenêtre Google fermée avant la fin." : "La connexion Google n'a pas abouti."), {type}));
      },
    });
    client.requestAccessToken(choisir ? {prompt: "select_account"} : compte ? {prompt: "", hint: compte} : {});
  }));
  attenteJeton = p;
  const fin = () => { if (attenteJeton === p) attenteJeton = null; };
  p.then(fin, fin);
  return p;
}

function planifierRenouvellement() {
  clearTimeout(minuterie);
  if (!jeton || !expireA) return;
  minuterie = setTimeout(renouveler, Math.max(expireA - Date.now() - MARGE_RENOUV, 1000));
}
// Appelé par la minuterie ET à chaque toucher de la page (un toucher est ce qui autorise la fenêtre Google).
function renouveler() {
  if (!jeton || document.hidden || !compteMemorise()) return;
  if (expireA - Date.now() > 2 * MARGE_RENOUV || Date.now() - dernierEssai < 60000) return;
  demanderJeton(true).catch(() => {});
}

function ecranConnexion(txt) {
  const c = compteMemorise();
  message(txt);
  if (!$("btn-connexion")) return;
  $("btn-connexion").hidden = false; $("btn-connexion").textContent = c ? "Continuer (" + c + ")" : "Se connecter avec Google";
  $("btn-autre-compte").hidden = !c;
}
async function connecter(choisir) {
  if (!CLIENT_ID) { message("Portail pas encore relié à Google : l'identifiant client OAuth reste à installer (voir la fiche du chantier)."); return; }
  try { await demanderJeton(false, choisir === true); } catch (e) { ecranConnexion(e.message); return; }
  charger();
}
function apprendreCompte() {
  drive("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)").then((r) => r.json())
    .then((j) => { if (j && j.user && j.user.emailAddress) memoriserCompte(j.user.emailAddress); }).catch(() => {});
}

// ---------------------------------------------------------------- lecture Drive (lecture seule)
async function drive(url, repris) {
  if (attenteJeton) await attenteJeton.catch(() => {});
  const r = await fetch(url, {headers: {Authorization: "Bearer " + jeton}});
  if (r.status === 401) {
    if (!repris && compteMemorise()) {
      let ok = false;
      try { await demanderJeton(true); ok = true; } catch (e) {}
      if (ok) return drive(url, true);
    }
    oublierJeton(); throw Object.assign(new Error("Session expirée."), {reconnecter: true});
  }
  if (r.status === 403 || r.status === 404) throw new Error("Ce compte Google n'a pas accès aux données du Radar.");
  if (!r.ok) throw new Error("Drive a répondu " + r.status + ".");
  return r;
}
async function lireFichier(nom) {
  const q = encodeURIComponent(`'${DOSSIER_DONNEES}' in parents and name = '${nom}' and trashed = false`);
  const liste = await (await drive(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=1&supportsAllDrives=true&includeItemsFromAllDrives=true`)).json();
  if (!liste.files || !liste.files.length) return null;
  return (await drive(`https://www.googleapis.com/drive/v3/files/${liste.files[0].id}?alt=media&supportsAllDrives=true`)).json();
}

async function charger() {
  if (chargement) return;
  chargement = true;
  message("Lecture des données du Radar…"); $("btn-connexion").hidden = true; $("btn-autre-compte").hidden = true;
  try {
    [donnees, journal] = await Promise.all([lireFichier(NOM_DONNEES), lireFichier(NOM_JOURNAL).catch(() => null)]);
    if (!donnees) throw new Error("donnees.json introuvable dans « 03 - Donnees machine ».");
    afficher();
    apprendreCompte();
  } catch (e) {
    if (e.reconnecter) ecranConnexion("Session expirée. Un toucher suffit pour revenir.");
    else { $("btn-connexion").hidden = false; $("btn-connexion").textContent = "Réessayer"; $("btn-autre-compte").hidden = !compteMemorise(); message(e.message); }
  } finally { chargement = false; }
}

// ---------------------------------------------------------------- affichage
function afficher() {
  const ims = Array.isArray(donnees.immeubles) ? donnees.immeubles : [];
  $("accueil").hidden = true; $("barre").hidden = false; $("kpis").hidden = false; $("pied").hidden = false;

  const fmt = String(donnees.format);
  $("pied").textContent = "Données générées le " + dateHeure(donnees.genere_le) + " (format " + fmt + ")."
    + (FORMATS_CONNUS.includes(fmt) ? "" : " ⚠ Format inconnu de cette page : affichage possiblement incomplet.")
    + " Écarts = valeur économique − prix demandé, arrondis au millier. MRB = prix demandé ÷ revenus bruts.";

  // Secteurs (liste déroulante)
  const sel = $("secteur"), choisi = sel.value;
  const secteurs = [...new Set(ims.map((i) => i.secteur).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
  sel.innerHTML = '<option value="">Tous les secteurs</option>' + secteurs.map((s) => `<option${s === choisi ? " selected" : ""}>${esc(s)}</option>`).join("");

  // État du dernier run
  const et = $("etat"); et.hidden = !journal;

const kpi = (v, l, off) => `<div class="kpi${off ? " off" : ""}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`;

function trier(ims) {
  const t = $("tri").value, bas = (v) => (estNb(v) ? 0 : 1);
  const recent = (a, b) => String(b.date_analyse || "").localeCompare(String(a.date_analyse || ""));
  const cles = {
    ecartC: (a, b) => bas(a.ecart?.C) - bas(b.ecart?.C) || (b.ecart?.C ?? 0) - (a.ecart?.C ?? 0) || recent(a, b),
    ecartA: (a, b) => bas(a.ecart?.A) - bas(b.ecart?.A) || (b.ecart?.A ?? 0) - (a.ecart?.A ?? 0) || recent(a, b),
    ppp: (a, b) => bas(a.prix_par_porte_demande) - bas(b.prix_par_porte_demande) || (a.prix_par_porte_demande ?? 0) - (b.prix_par_porte_demande ?? 0),
    recent,
  };
  return [...ims].sort(cles[t] || cles.ecartC);
}

function afficherCartes() {
  const ims = (donnees.immeubles || []).filter((i) => !$("secteur").value || i.secteur === $("secteur").value);
  const libTri = $("tri").selectedOptions[0].textContent.replace(/^Trier : /, "");
  $("sous-titre").textContent = ims.length + " immeuble" + (ims.length > 1 ? "s" : "") + " · trié par " + libTri;

  grille.querySelectorAll(".carte").forEach((c) => c.remove());
  if (!ims.length) { message("Aucun immeuble pour ce filtre."); return; }
  $("accueil").hidden = true;
  grille.insertAdjacentHTML("beforeend", trier(ims).map(carte).join(""));
}

function typo(t) {
  if (!t || typeof t !== "object") return "";
  const p = Object.entries(t).map(([k, n]) => `${n} × ${esc(String(k).replace(".5", "½"))}`);
  return p.length ? " (" + p.join(", ") + ")" : "";
}

function ligneLoyer(lo) {

}

function carte(im) {

// ---------------------------------------------------------------- partage d'une fiche (image + pièces jointes)
// « Partager » sur une carte ouvre un panneau : la fiche est dessinée en image dans la page (avec le tableau
// du détail et un plan), puis remise au menu de partage du téléphone (Messenger, WhatsApp, texto…), avec le
// lien Centris et, au choix, une COPIE du Cruncher en pièce jointe (jamais un lien Drive) et les notes.
// La personne qui reçoit n'a besoin d'aucun compte ni d'aucun accès au Drive. Aucun calcul : mêmes chiffres
// que la carte. Plan : OpenStreetMap (l'adresse de l'immeuble y est envoyée pour la situer).
const MIME_XLSM = "application/vnd.ms-excel.sheet.macroEnabled.12";
// Notes de François par immeuble (clé = id). Rempli par l'étape « Notes » du chantier (feuille Radar_Saisies).
let saisies = {};
const noteDe = (im) => String((saisies[im.id] && saisies[im.id].note) || "").trim();
const adresseCourte = (im) => String(im.adresse || "Adresse inconnue").replace(/,\s*Montr[ée]al\s*$/i, "");

function couper(ctx, txt, larg) {
  const lignes = [];
  for (const par of String(txt).split(/\n/)) {
    let l = "";
    for (const m of par.split(/\s+/).filter(Boolean)) {
      const e = l ? l + " " + m : m;
      if (l && ctx.measureText(e).width > larg) { lignes.push(l); l = m; } else l = e;
    }
    lignes.push(l);
  }
  return lignes;
}

// ---- plan (OpenStreetMap) : adresse -> coordonnées -> tuiles. Échec = image sans plan, jamais de blocage.
const cacheGeo = {};
async function situer(adresse) {
  if (cacheGeo[adresse]) return cacheGeo[adresse];
  const propre = adresse.replace(/^(\d+)\s*,/, "$1");
  const essais = [...new Set([propre, propre.replace(/^(\d+)\s*[-–]\s*\d+/, "$1")])];
  for (const a of essais) {
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ca&q="
        + encodeURIComponent(a + ", Québec, Canada"));
      const j = r.ok ? await r.json() : [];
      if (j[0] && isFinite(+j[0].lat) && isFinite(+j[0].lon)) return (cacheGeo[adresse] = {lat: +j[0].lat, lon: +j[0].lon});
    } catch (e) {}
  }
  return null;
}
async function chargerPlan(adresse, l, h) {
  const pt = await situer(adresse);
  if (!pt) return null;
  const Z = 16, T = 128, n = 2 ** Z, rad = pt.lat * Math.PI / 180;   // tuiles de 256 px dessinées à 128 : net à l'échelle 2
  const px = (pt.lon + 180) / 360 * n * T, py = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n * T;
  const x0 = px - l / 2, y0 = py - h / 2, attente = [];
  for (let tx = Math.floor(x0 / T); tx * T < x0 + l; tx++) for (let ty = Math.floor(y0 / T); ty * T < y0 + h; ty++)
    attente.push(new Promise((ok) => {
      const i = new Image(); i.crossOrigin = "anonymous";
      i.onload = () => ok({i, dx: tx * T - x0, dy: ty * T - y0}); i.onerror = () => ok(null);
      i.src = `https://tile.openstreetmap.org/${Z}/${tx}/${ty}.png`;
    }));
  const tuiles = await Promise.all(attente);
  return tuiles.every(Boolean) ? {tuiles, T, l, h} : null;
}
const delai = (ms) => new Promise((ok) => setTimeout(() => ok(null), ms));

// ---- dessin de la fiche. opts : {plan, notes}
const PLAN_H = 190;
function dessinerFiche(ctx, im, L, opts) {
  opts = opts || {};
  const C = {ink: "#1d2330", mute: "#6b7280", line: "#e5e7eb", bg: "#f6f7f9", pos: "#0f7b4b", posbg: "#e6f4ec", neg: "#b42318", negbg: "#fdecea", acc: "#2446a8", warnbg: "#fff4de"};
  const P = 24, larg = L - 2 * P, police = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  const f = (taille, poids) => { ctx.font = `${poids || 400} ${taille}px ${police}`; };
  const chemin = (x, y, w, h, r) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };
  const boite = (x, y, w, h, couleur) => { ctx.fillStyle = couleur; chemin(x, y, w, h, 8); ctx.fill(); };
  // Écrit un texte en réduisant la taille s'il dépasse la largeur donnée.
  const ecrire = (txt, x, y, taille, poids, couleur, max, aligne) => {
    let t = taille; f(t, poids);
    while (max && t > 9 && ctx.measureText(txt).width > max) { t -= 0.5; f(t, poids); }
    ctx.fillStyle = couleur; ctx.textAlign = aligne || "left"; ctx.fillText(txt, x, y);
  };
  const paragraphe = (txt, x, y, taille, poids, couleur, max, interligne) => {
    f(taille, poids); ctx.fillStyle = couleur; ctx.textAlign = "left";
    for (const l of couper(ctx, txt, max)) { ctx.fillText(l, x, y); y += interligne; }
    return y;
  };
  const titre = (txt, y) => { ecrire(txt, P, y, 10.5, 650, C.mute); return y + 16; };
  const ve = im.valeur_economique || {}, ec = im.ecart || {}, mrb = im.mrb || {}, lo = im.loyer_moyen_porte;
  ctx.textBaseline = "alphabetic";
  let y = P + 12;

  // Bandeau
  ecrire("RADAR IMMOBILIER", P, y, 11, 650, C.mute);
  ecrire([im.provenance === "centris" && im.no_inscription ? "Centris " + im.no_inscription : "",
          "analysé le " + dateCourte(im.date_analyse)].filter(Boolean).join(" · "), L - P, y, 11, 400, C.mute, larg - 130, "right");
  y += 30;

  // Adresse, secteur, portes
  y = paragraphe(adresseCourte(im), P, y, 22, 650, C.ink, larg, 27);
  y = paragraphe((im.secteur || "Secteur inconnu") + " · " + (estNb(im.nb_logements) ? im.nb_logements + " portes" : "portes ?")
    + typo(im.typologie), P, y - 6, 13, 400, C.mute, larg, 18) + 2;

  // Prix demandé, prix par porte, MRB
  const esp = 8, l1 = (larg - 2 * esp) * 0.41, l2 = (larg - 2 * esp) * 0.33, l3 = larg - 2 * esp - l1 - l2, h = 66;
  [[P, l1, "Prix demandé", $$(im.prix_demande), 21, ""],
   [P + l1 + esp, l2, "Prix par porte", $$(im.prix_par_porte_demande), 18, ""],
   [P + l1 + l2 + 2 * esp, l3, "MRB", estNb(mrb.A) ? nb1.format(mrb.A) : "—", 18, estNb(mrb.C) ? "potentiel : " + nb1.format(mrb.C) : ""],
  ].forEach(([x, w, lib, val, taille, note]) => {
    boite(x, y, w, h, C.bg);
    ecrire(lib, x + 10, y + 19, 11, 400, C.mute, w - 20);
    ecrire(val, x + 10, y + 43, taille, 700, C.ink, w - 20);
    if (note) ecrire(note, x + 10, y + 58, 10.5, 400, C.mute, w - 20);
  });
  y += h + 26;

  // Valeur économique A / B / C et écarts
  const lc = (larg - 2 * esp) / 3, hE = 52, aEcart = estNb(ec.A) || estNb(ec.C);
  [["A · actuel", ve.A, ec.A], ["B · converti", ve.B, null], ["C · final", ve.C, ec.C]].forEach(([lib, val, ecart], i) => {
    const x = P + i * (lc + esp), cx = x + lc / 2;
    ecrire(lib, cx, y, 11, 400, C.mute, lc - 8, "center");
    ecrire($mille(val), cx, y + 24, 17, 650, C.ink, lc - 8, "center");
    if (estNb(ecart)) {
      boite(x, y + 36, lc, hE, ecart >= 0 ? C.posbg : C.negbg);
      ecrire("Écart avec le prix demandé", cx, y + 54, 9.5, 400, C.mute, lc - 10, "center");
      ecrire(signe$(ecart), cx, y + 76, 17, 700, ecart >= 0 ? C.pos : C.neg, lc - 10, "center");
    }
  });
  y += 36 + (aEcart ? hE + 26 : 14);

  // Microfiche (la ligne du loyer est refaite depuis le champ structuré, comme sur la carte)
  const loyer = lo && estNb(lo.A)
    ? `Loyer moyen par porte : ${$$(lo.A)}/mois actuel` + (estNb(lo.C) ? ` → ${$$(lo.C)}/mois potentiel (${estNb(lo.ecart) ? (lo.ecart >= 0 ? "+" : "−") + $$(Math.abs(lo.ecart)) : "—"})` : "")
    : null;
  const mf = (im.microfiche || []).map((t) => (/^Loyer moyen par porte/.test(t) && loyer) ? loyer : String(t));
  for (const l of mf) {
    ecrire("•", P + 2, y, 13, 400, C.ink);
    y = paragraphe(l, P + 16, y, 13, 400, C.ink, larg - 16, 18.5) + 4;
  }
  if (mf.length) y += 12;

  // Tableau du détail : revenus, dépenses, RNO, facteur de dépenses (+ TGA au prix demandé quand la machine le fournit)
  const Pt = im.portraits || {}, tg = im.tga_prix_demande || {};
  const aPortrait = ["A", "B", "C"].some((p) => Pt[p] && typeof Pt[p] === "object");
  if (aPortrait) {
    const n0 = (v) => estNb(v) ? nbFr.format(v) + " $" : "—", colL = larg * 0.37, colW = (larg - colL) / 3, hl = 25;
    const lignes = [["Revenus bruts", (p) => n0((Pt[p] || {}).revenus_bruts)], ["Dépenses", (p) => n0((Pt[p] || {}).depenses_totales)],
                    ["Revenu net (RNO)", (p) => n0((Pt[p] || {}).rno)], ["Facteur de dépenses", (p) => pct((Pt[p] || {}).facteur_depenses)]];
    if (["A", "B", "C"].some((p) => estNb(tg[p]))) lignes.push(["TGA au prix demandé", (p) => pct(tg[p])]);
    y = titre("DÉTAIL", y);
    ["A · actuel", "B · converti", "C · final"].forEach((t, i) => ecrire(t, P + colL + (i + 1) * colW, y, 10.5, 400, C.mute, colW - 6, "right"));
    y += 8;
    for (const [lib, val] of lignes) {
      ctx.fillStyle = C.line; ctx.fillRect(P, y, larg, 1);
      ecrire(lib, P, y + 17, 12.5, 400, C.ink, colL - 6);
      ["A", "B", "C"].forEach((p, i) => ecrire(val(p), P + colL + (i + 1) * colW, y + 17, 12.5, 500, C.ink, colW - 6, "right"));
      y += hl;
    }
    y += 16;
  }

  // Plan
  if (opts.plan) {
    const pl = opts.plan;
    ctx.save(); chemin(P, y, larg, pl.h, 10); ctx.clip();
    ctx.fillStyle = C.bg; ctx.fillRect(P, y, larg, pl.h);
    for (const t of pl.tuiles) ctx.drawImage(t.i, P + t.dx, y + t.dy, pl.T, pl.T);
    const cx = P + larg / 2, cy = y + pl.h / 2;                       // repère de l'immeuble
    ctx.beginPath(); ctx.arc(cx, cy, 15, 0, 2 * Math.PI); ctx.fillStyle = "rgba(180,35,24,.18)"; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 6.5, 0, 2 * Math.PI); ctx.fillStyle = C.neg; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#fff"; ctx.stroke();
    f(9, 400); const cr = "© OpenStreetMap", lw = ctx.measureText(cr).width + 10;
    ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fillRect(P + larg - lw, y + pl.h - 16, lw, 16);
    ctx.fillStyle = C.mute; ctx.textAlign = "right"; ctx.fillText(cr, P + larg - 5, y + pl.h - 5);
    ctx.restore();
    ctx.lineWidth = 1; ctx.strokeStyle = C.line; chemin(P + .5, y + .5, larg - 1, pl.h - 1, 10); ctx.stroke();
    y += pl.h + 24;
  }

  // Notes (seulement si François choisit de les joindre)
  if (opts.notes) {
    y = titre("NOTES", y);
    f(12.5, 400);
    const lg = couper(ctx, opts.notes, larg - 24), hn = lg.length * 18 + 18;
    boite(P, y - 4, larg, hn, C.warnbg);
    paragraphe(opts.notes, P + 12, y + 15, 12.5, 400, C.ink, larg - 24, 18);
    y += hn + 18;
  }

  // Pied
  ctx.fillStyle = C.line; ctx.fillRect(P, y - 6, larg, 1); y += 12;
  y = paragraphe("Valeur économique = revenu net ÷ TGA" + (estNb(ve.tga) ? " de " + pct(ve.tga) : "") + ". Écart = valeur économique − prix demandé, arrondi au millier."
    + " MRB = prix demandé ÷ revenus bruts. Estimation préliminaire, à valider.", P, y, 10.5, 400, C.mute, larg, 15);
  return y + P - 12;
}
function imageFiche(im, opts) {
  const L = 540, ECHELLE = 2, brouillon = document.createElement("canvas");
  brouillon.width = 8; brouillon.height = 8;
  let ctx = brouillon.getContext("2d");
  const haut = Math.ceil(dessinerFiche(ctx, im, L, Object.assign({}, opts, {plan: opts && opts.plan ? {tuiles: [], T: 0, h: opts.plan.h} : null})));  // 1er passage : mesure
  const toile = document.createElement("canvas");
  toile.width = L * ECHELLE; toile.height = haut * ECHELLE;
  ctx = toile.getContext("2d"); ctx.scale(ECHELLE, ECHELLE);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, L, haut);
  dessinerFiche(ctx, im, L, opts);
  // Conversion immédiate (sans attente) : le menu de partage doit s'ouvrir dans le même geste.
  const brut = atob(toile.toDataURL("image/png").split(",")[1]), octets = new Uint8Array(brut.length);
  for (let i = 0; i < brut.length; i++) octets[i] = brut.charCodeAt(i);
  return new Blob([octets], {type: "image/png"});
}

// ---- panneau de partage
let pp = null;   // partage en cours : {im, plan, planFini, cruncher, crFini, crErreur, image}
const nomSur = (s) => String(s).replace(/[\\/:*?"<>|]/g, " ").replace(/\s+/g, " ").trim();
const tailleMo = (o) => nb1.format(o / 1048576) + " Mo";
function majPartage() {
  const e = pp; if (!e) return;
  const avecNotes = e.note && $("pp-notes").checked, avecCr = e.crPossible && $("pp-cr").checked;
  try { e.image = imageFiche(e.im, {plan: e.plan, notes: avecNotes ? e.note : ""}); } catch (err) { e.image = null; }
  if (e.urlApercu) URL.revokeObjectURL(e.urlApercu);
  e.urlApercu = e.image ? URL.createObjectURL(e.image) : ""; $("pp-apercu").src = e.urlApercu;
  const pret = e.image && e.planFini && (!avecCr || e.crFini);
  $("pp-envoyer").disabled = !pret;
  let t = "";
  if (!e.image) t = "L'image n'a pas pu être produite.";
  else if (!e.planFini) t = "Préparation du plan…";
  else if (avecCr && !e.crFini) t = "Préparation de la copie du Cruncher…";
  else {
    const p = ["Image de la fiche"];
    if (avecCr && e.cruncher) p.push("copie du Cruncher (" + tailleMo(e.cruncher.size) + ")");
    if (e.im.url) p.push("lien Centris");
    t = "Prêt : " + p.join(" + ") + "." + (e.plan ? "" : " Plan indisponible pour cette adresse.");
    if (avecCr && !e.cruncher) t += " ⚠ Cruncher non joint : " + (e.crErreur || "fichier introuvable") + ".";
  }
  if (e.avis) t = e.avis;
  $("pp-etat").textContent = t;
  $("pp-telecharger").hidden = !e.aTelecharger; $("pp-annuler").textContent = e.aTelecharger ? "Fermer" : "Annuler";
}
function ouvrirPartage(im) {
  const cr = im.cruncher || {}, e = pp = {im, note: noteDe(im), plan: null, planFini: false, cruncher: null, crFini: false, crErreur: "", crPossible: !!(cr.drive_id && jeton)};
  $("pp-titre").textContent = "Partager — " + adresseCourte(im);
  $("pp-l-notes").hidden = !e.note; $("pp-notes").checked = true;
  $("pp-cr").checked = e.crPossible; $("pp-cr").disabled = !e.crPossible;
  $("pp-l-cr").style.opacity = e.crPossible ? "" : ".5";
  majPartage();
  const d = $("pp"); if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  // Plan : au plus 7 secondes, puis on continue sans.
  Promise.race([chargerPlan(String(im.adresse || ""), 540 - 48, PLAN_H).catch(() => null), delai(7000)])
    .then((p) => { if (pp !== e) return; e.plan = p; e.planFini = true; majPartage(); });
  // Copie du Cruncher : téléchargée depuis le Drive de François, pour être envoyée en pièce jointe.
  if (e.crPossible) {
    drive(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(cr.drive_id)}?alt=media&supportsAllDrives=true`)
      .then((r) => r.blob())
      .then((b) => { e.cruncher = new File([b], nomSur(cr.nom || "Cruncher.xlsm"), {type: b.type && b.type !== "application/octet-stream" ? b.type : MIME_XLSM}); })
      .catch((err) => { e.crErreur = err && err.reconnecter ? "session Google expirée, reconnecte-toi" : "le fichier n'a pas pu être lu dans le Drive"; })
      .then(() => { e.crFini = true; if (pp === e) majPartage(); });
  }
}
function fermerPartage() {
  if (pp && pp.urlApercu) URL.revokeObjectURL(pp.urlApercu);
  pp = null; const d = $("pp"); if (d.close) d.close(); else d.removeAttribute("open");
}
function telechargerFichier(fichier) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(fichier); a.download = fichier.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 20000);
}
// Appelé directement par le clic sur « Envoyer » : tout est déjà prêt, le menu de partage s'ouvre dans le même geste.
async function envoyerPartage() {
  const e = pp; if (!e || !e.image) return;
  const im = e.im, courte = adresseCourte(im);
  const image = new File([e.image], "Fiche - " + nomSur(courte) + ".png", {type: "image/png"});
  const cr = e.crPossible && $("pp-cr").checked ? e.cruncher : null;
  const texte = courte + (im.url ? "\n" + im.url : "");
  const peut = (f) => { try { return !!(navigator.canShare && navigator.share && navigator.canShare({files: f})); } catch (err) { return false; } };
  const dire = (t) => { e.avis = t; if (pp === e) majPartage(); };
  if (peut([image])) {                                                             // téléphone
    // Rien avant navigator.share : un téléchargement lancé ici consomme le geste de l'utilisateur et Android
    // refuse alors le partage (NotAllowedError). Le Cruncher non partageable s'offre après, par son propre bouton.
    const tout = cr && peut([image, cr]);
    try { await navigator.share({files: tout ? [image, cr] : [image], title: courte, text: texte}); }
    catch (err) { if (err && err.name === "AbortError") return; dire("Le partage a échoué (" + (err && err.name || "erreur") + ")."); return; }
    if (cr && !tout) { e.aTelecharger = cr; dire("Fiche envoyée. Ce téléphone refuse le fichier Excel dans ce menu : touche « Télécharger le Cruncher », puis joins-le à la main depuis tes téléchargements."); }
    else fermerPartage();
    return;
  }
  telechargerFichier(image); if (cr) telechargerFichier(cr);                         // ordinateur
  let copie = false; try { if (im.url) { await navigator.clipboard.writeText(texte); copie = true; } } catch (err) {}
  dire((cr ? "Image et copie du Cruncher téléchargées" : "Image téléchargée") + (copie ? " · lien Centris copié." : "."));
}

function afficherJournal() {
  const runs = (journal && journal.runs) || [];
  $("journal").innerHTML = runs.length ? runs.slice(0, 20).map((r) =>
    `<div class="run"><b>Run ${esc(r.run)}</b> · ${dateHeure(r.date)} · ${r.probleme ? "⚠ problème" : esc(r.conclusion || "")}
     ${r.lien && /^https:\/\/github\.com\//.test(r.lien) ? ` · <a href="${esc(r.lien)}" target="_blank" rel="noopener">GitHub</a>` : ""}
     <pre>${esc((r.rapport || []).join("\n"))}</pre></div>`).join("") : "Aucun run inscrit au journal.";
}

// ---------------------------------------------------------------- événements
$("btn-connexion").addEventListener("click", () => (jeton ? charger() : connecter()));
$("btn-autre-compte").addEventListener("click", () => { oublierJeton(); memoriserCompte(""); connecter(true); });
document.addEventListener("click", renouveler, true);
document.addEventListener("visibilitychange", () => { if (!document.hidden) planifierRenouvellement(); });
$("tri").addEventListener("change", afficherCartes);
$("secteur").addEventListener("change", afficherCartes);
// Partager : menu de partage du téléphone (Messenger, WhatsApp, texto…) ; sinon, copie du lien.
$("btn-partager").addEventListener("click", async () => {
  const dire = (t) => { $("txt-partager").textContent = t; setTimeout(() => { $("txt-partager").textContent = "Partager"; }, 2500); };
  if (navigator.share) {
    try { await navigator.share({title: "Radar immobilier", text: "Aperçu de mon Radar immobilier", url: LIEN_PARTAGE}); }
    catch (e) { if (e && e.name !== "AbortError") dire("Échec"); }
    return;
  }
  try { await navigator.clipboard.writeText(LIEN_PARTAGE); dire("Lien copié"); } catch (e) { dire("Échec"); }
});
// Partager une fiche : bouton « Partager » de chaque carte -> panneau de partage.
$("grille").addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest("[data-partager]");
  if (!b) return;
  const im = ((donnees && donnees.immeubles) || []).find((i) => String(i.id || "") === b.dataset.partager);
  if (im) ouvrirPartage(im);
});
$("pp-envoyer").addEventListener("click", envoyerPartage);
$("pp-annuler").addEventListener("click", fermerPartage);
$("pp-telecharger").addEventListener("click", () => { if (pp && pp.aTelecharger) telechargerFichier(pp.aTelecharger); });
$("pp").addEventListener("cancel", () => { if (pp && pp.urlApercu) URL.revokeObjectURL(pp.urlApercu); pp = null; });
["pp-notes", "pp-cr"].forEach((id) => $(id).addEventListener("change", () => { if (pp) { pp.avis = ""; majPartage(); } }));
const basculerJournal = () => { $("panneau-journal").hidden = !$("panneau-journal").hidden; };
$("etat").addEventListener("click", basculerJournal);
// La petite carte Google Maps ne se charge qu'à l'ouverture du détail.
document.addEventListener("toggle", (e) => {
  const f = e.target.open && e.target.querySelector && e.target.querySelector("iframe[data-src]");
  if (f) { f.src = f.dataset.src; f.removeAttribute("data-src"); }
}, true);

jeton = lireJetonMemorise();
if (jeton) { planifierRenouvellement(); charger(); if (compteMemorise()) chargerGIS().catch(() => {}); }
else if (CLIENT_ID && compteMemorise()) {
  // Retour après expiration : un essai sans clic (réussit si le navigateur laisse passer la fenêtre), sinon un bouton.
  ecranConnexion("Session expirée. Un toucher suffit pour revenir.");
  demanderJeton(true).then(charger, () => {});
}
else if (!CLIENT_ID) message("Portail pas encore relié à Google : l'identifiant client OAuth reste à installer (voir la fiche du chantier).");
</script>
</body>
