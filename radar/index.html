<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Radar immobilier — fiche partagée">
<meta property="og:description" content="Fiches d'immeubles partagées par François. Ouvre le lien pour les voir, sans compte.">
<title>Radar immobilier — Portail</title>
<!--
  Portail du Radar immobilier — page /radar/ (module M7, format 1 de donnees.json).
  Coquille publique (décision 1-C, 29 sept. 2026) : AUCUNE donnée dans ce fichier.
  Après connexion Google, la page lit donnees.json et journal_runs.json dans le Drive
  (« Radar immobilier / 03 - Donnees machine ») — lecture seule, jamais d'écriture.
  Aucun calcul, sauf un : quand le prix demandé a changé depuis l'analyse (bloc « marche »), le prix par porte,
  le MRB et les écarts sont refaits sur le prix courant (fonction vue). Tout le reste vient du Cruncher et
  d'assembler.py.
  État des annonces (bloc « marche ») : statut « retiree » = fiche archivée ; « promesse_conditionnelle » =
  étiquette (Centris ne l'affiche pas au public : relevé du 13 oct. 2026 sur 800 annonces) ; variation_prix =
  baisse ou hausse en dollars.
  Pastille « Dernier run » (bêta 0.22) : dernier passage de la collecte, lu dans journal_runs.json (bloc
  « collecte », écrit par le script Google). Verte = réussi ; rouge = échec ; jaune = plus de 3 h sans passage,
  heures de nuit (23 h à 6 h, Montréal) non comptées. Sans bloc « collecte » : dernière analyse, comme avant.
  Mise à jour automatique (bêta 0.23) : au retour sur l'onglet, la page compare son numéro de version (étiquette
  « bêta X.YY ») à celui de la page en ligne et se recharge seule s'il a changé, jamais pendant une frappe.
  Le numéro DOIT donc changer à chaque publication.
  Partage par lien (bêta 0.24, CHANTIER_Partage.md) : « Partager » inscrit une ligne dans l'onglet « Partages » de
  Radar_Saisies et envoie UN lien …/radar/?p=CODE. Avec ce code, la page passe en MODE INVITÉ : sans connexion Google,
  elle demande les fiches au script Google « Radar_Partage » (URL_SCRIPT_PARTAGE), en lecture seule.
  Contrat de données : CHANTIER_Portail_Premiere_Carte.md §5.
-->
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--pos:#0f7b4b;--posbg:#e6f4ec;--neg:#b42318;--negbg:#fdecea;--acc:#2446a8;--warn:#8a5a00;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:1200px;margin:auto}
h1{font-size:19px;margin:0}.sub{color:var(--mute);font-size:13px}
/* Numéro de version : augmenter à CHAQUE publication de cette page (bêta 0.21, 0.22, 0.23… : un centième à la fois, il y aura beaucoup d'itérations). */
.ver{font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:3px;letter-spacing:.02em}
.etat{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--mute);border:0;font-family:inherit;cursor:pointer}
.etat.ok{background:var(--posbg);color:var(--pos)}.etat.ko{background:var(--negbg);color:var(--neg)}.etat.av{background:var(--warnbg);color:var(--warn)}
#journal h3{font-size:14px;margin:4px 0 6px}#journal .passage{font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}#journal .passage.ko{color:var(--neg)}
.barre{display:flex;gap:8px;flex-wrap:wrap;max-width:1200px;margin:10px auto 0}
.barre select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);flex:1 1 0;min-width:0;max-width:340px;text-overflow:ellipsis}
.etat .ct{display:none}
.partage{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--acc);border-radius:8px;background:var(--acc);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;white-space:nowrap}
.partage svg{width:15px;height:15px;flex:0 0 auto}
.kpis{display:flex;gap:10px;flex-wrap:wrap;max-width:1200px;margin:16px auto 0;padding:0 16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px;flex:1 1 120px}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mute)}.kpi.off{opacity:.5}
main{max-width:1200px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px}
.carte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tag{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.haut{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}.haut .tag{flex:0 0 auto;white-space:nowrap}
.notes .etat{background:none;padding:0;border-radius:0;cursor:default}
/* Statut de l'immeuble dans l'entonnoir : une liste déroulante en forme de pastille. */
.etape{flex:0 1 auto;min-width:0;font:inherit;font-size:12px;font-weight:650;height:30px;padding:0 8px;border-radius:99px;border:1px solid #c3c8d1;background:#fff;color:var(--ink);cursor:pointer;text-overflow:ellipsis}
.etape.neuf{border-color:var(--acc);background:#eef2fc;color:var(--acc)}.etape.ecarte{color:var(--mute);background:var(--bg)}.etape:disabled{opacity:.55;cursor:default}
.etiq{display:flex;gap:6px;flex-wrap:wrap}.etiq span{font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--warnbg);color:#7a4f00}
/* Fiche archivée (annonce retirée de Centris) : contour jaune sur toute la fiche. */
.carte.arch{border:3px solid #e0a100;background:#fffdf7}
.pxd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prix .av{font-size:12.5px;color:var(--mute);text-decoration:line-through;white-space:nowrap}
.var{flex:0 0 auto;text-align:center;font-size:12px;font-weight:650;line-height:1.25;padding:4px 10px;border-radius:10px;background:var(--posbg);color:var(--pos);white-space:nowrap}
.var.h{background:var(--warnbg);color:#7a4f00}.var small{display:block;font-size:11px;font-weight:500}
/* Pastilles du haut : quatre filtres (actives, nouvelles, baisses, archivées). */
.puce{flex:1 1 0;min-width:0;max-width:170px;min-height:44px;background:#fff;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:12px;line-height:1.2;color:var(--ink);cursor:pointer;padding:4px 6px}
.puce b{display:block;font-size:17px}.puce.on{border:2px solid var(--acc)}.puce.v b{color:var(--pos)}
/* Secteurs : liste à cocher (plusieurs secteurs à la fois). */
.msel{position:relative;flex:1 1 0;min-width:0;max-width:340px}
.msel>button{width:100%;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.msel>button[aria-expanded=true]{border-color:var(--acc);outline:1px solid var(--acc)}
.msel-p{position:absolute;top:calc(100% + 6px);right:0;width:max-content;min-width:100%;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,25,35,.14);z-index:5;max-height:70vh;overflow:auto}
.msel-p label{min-height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.msel-p label.tous{font-weight:650}.msel-p label span{flex:1 1 auto}.msel-p label small{color:var(--mute);font-size:12px}
.msel-p input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--acc)}
.msel-p .fin{display:flex;justify-content:flex-end;padding:8px 14px}.msel-p .fin .btn{min-height:40px;padding:0 18px;font-size:14px}
.adr{font-weight:650;font-size:16px;margin:0}.meta{color:var(--mute);font-size:13px}
.prix{display:grid;grid-template-columns:1fr 1fr;gap:6px}.prix>div:first-child{grid-column:1/-1}
.prix>div{background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.prix .l{font-size:11px;color:var(--mute)}.prix .v{font-size:17px;font-weight:700;white-space:nowrap}
.prix .v.s{font-size:15px}.prix .r{font-size:11px;color:var(--mute)}
table.abc{width:100%;border-collapse:separate;border-spacing:4px 0;table-layout:fixed}
.abc th{font-size:11px;color:var(--mute);font-weight:500;text-align:center;padding-bottom:2px}
.abc td{text-align:center;white-space:nowrap}
.abc .val td{font-weight:650;font-size:14.5px;padding:4px 0}
.abc .ec td{padding:6px 2px;border-radius:8px}
.abc .ec .l{display:block;font-size:10.5px;color:var(--mute);white-space:normal;line-height:1.2}
.abc .ec b{font-size:15px}
.pos{background:var(--posbg)}.pos b{color:var(--pos)}.neg{background:var(--negbg)}.neg b{color:var(--neg)}
ul.mf{margin:0;padding-left:18px;font-size:13px}ul.mf li{margin:2px 0}
.chk{display:inline-block;width:15px;height:15px;border:1.5px solid var(--mute);border-radius:4px;vertical-align:-2px;margin-left:4px;opacity:.6}
.bas{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notes{display:flex;flex-direction:column;gap:3px}
.notes label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.notes textarea{width:100%;box-sizing:border-box;min-height:36px;resize:none;overflow:hidden;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);background:var(--warnbg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.notes textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;background:#fff}
.notes textarea:disabled{background:var(--bg);color:var(--mute)}
.notes .etat{font-size:11px;color:var(--mute);min-height:14px}.notes .etat.ko{color:var(--neg)}
.bande-notes{max-width:1200px;margin:12px auto 0;padding:0 16px}
.bande-notes>div{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{text-decoration:none;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--acc);color:var(--acc);background:#fff;font-family:inherit;cursor:pointer}
.btn.p{background:var(--acc);color:#fff}.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.score{margin-left:auto;font-size:12px;color:var(--mute)}
details{font-size:13px}summary{cursor:pointer;color:var(--acc)}
table.det{width:100%;border-collapse:collapse;margin-top:6px}
.det td,.det th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right;font-weight:400}
.det td:first-child,.det th:first-child{text-align:left}.det th{color:var(--mute);font-size:12px}
.det-plan{width:100%;height:180px;border:0;border-radius:8px;margin-top:8px}
.flag{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 8px;margin:6px 0 0}
.accueil{max-width:520px;margin:48px auto;padding:24px 16px;text-align:center;grid-column:1/-1}
.accueil p{color:var(--mute)}
.lienb{background:none;border:0;padding:6px;color:var(--mute);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.panneau{max-width:1200px;margin:12px auto 0;padding:0 16px}
.panneau .boite{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.panneau .run{border-bottom:1px solid var(--line);padding:8px 0}.panneau .run:last-child{border:0}
.panneau pre{white-space:pre-wrap;margin:4px 0 0;font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--mute)}
.note{max-width:1200px;margin:0 auto 24px;padding:0 16px;color:var(--mute);font-size:12px}
dialog.pp{border:0;border-radius:14px;padding:16px;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;color:var(--ink);font:inherit;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog.pp::backdrop{background:rgba(20,25,35,.45)}
.pp h2{font-size:16px;margin:0 0 10px}
.pp .ap{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.pp .ap img{width:100%;display:block}
.pp label{display:flex;gap:8px;align-items:center;font-size:14px;margin:12px 0 0;cursor:pointer}
.pp input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;accent-color:var(--acc)}
.pp .st{font-size:12.5px;color:var(--mute);min-height:36px;margin:10px 0}
.pp .act{display:flex;gap:8px;justify-content:flex-end}
.pp .btn{padding:9px 16px;font-size:14px}.btn:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
/* Partage par lien (bêta 0.24) */
.pp .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.pp .seg button{font:inherit;font-size:14px;padding:9px;border:0;background:#fff;color:var(--ink);cursor:pointer}
.pp .seg button[aria-pressed=true]{background:#eef2fc;color:var(--acc);font-weight:650}
.pp .seg button[hidden]+button{grid-column:1/-1}
.pp-fiche{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.pp-fiche small,.pp-liste small{display:block;color:var(--mute);font-size:12px}
.pp-outils{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}.pp-outils span{flex:1 1 auto}
.pp .pp-liste{max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:4px}
.pp .pp-liste label{margin:0;padding:8px 10px;border-bottom:1px solid var(--line);align-items:flex-start}
.pp .pp-liste label:last-child{border:0}
.pp label small{display:block;color:var(--mute);font-size:12px}
.pp .champ{flex-direction:column;align-items:stretch;gap:4px;font-size:13px;color:var(--mute)}
.pp .champ input{font:inherit;font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.pp .lien{font-size:12px;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:6px 8px;color:var(--mute);user-select:all;margin-bottom:10px}
/* Mode invité */
h1 .inv{font-size:11px;font-weight:600;color:var(--acc);margin-left:4px;vertical-align:3px}
.invite #btn-partager{display:none!important}
.note-inv{background:var(--warnbg);border-radius:8px;padding:7px 9px;font-size:14px;white-space:pre-wrap}
.note-inv b{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;font-weight:500}
/* Téléphone : en-tête réduit à deux lignes (titre + dernier run, puis tri + secteur côte à côte). */
@media (max-width:600px){
 header{padding:6px 12px}.top{flex-wrap:nowrap;gap:8px}
 h1{font-size:16px;white-space:nowrap}h1 .lg,.sub,.etat .lg{display:none}.etat .ct{display:inline}
 .etat{font-size:12px;padding:3px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
 .barre{margin-top:6px;gap:6px;flex-wrap:nowrap}.barre select{max-width:none;padding:5px 8px}.msel{max-width:none}.msel>button{padding:5px 8px}.puce{max-width:none}.puce b{font-size:15px}.partage{padding:5px 10px}.partage span{display:none}
 .kpis{margin-top:8px;gap:6px;flex-wrap:nowrap}.kpi.off{display:none}
 .kpi{display:flex;align-items:baseline;gap:6px;padding:4px 10px;min-width:0;flex:1 1 0;white-space:nowrap;overflow:hidden}
 .kpi b{display:inline;font-size:15px}main{margin-top:8px}
}
</style>
</head>
<body>
<header>
 <div class="top">
  <div><h1>Radar immobilier<span class="lg"> — Portail</span><span class="ver" title="Version de cette page">bêta 0.25</span><span class="inv" hidden>(invité)</span></h1><div class="sub" id="sous-titre">Connexion requise</div></div>
  <button class="etat" id="etat" type="button" hidden></button>
 </div>
 <div class="barre" id="barre" hidden>
  <select id="tri" aria-label="Trier">
   <option value="ecartC">Trier : écart C ↓ (potentiel)</option>
   <option value="ecartA">Écart A ↓ (plus petit écart à négocier)</option>
   <option value="ppp">Prix par porte ↑ (le moins cher d'abord)</option>
   <option value="mrbA">MRB ↑ (actuel, le plus bas d'abord)</option>
   <option value="mrbC">MRB ↑ (potentiel C)</option>
   <option value="baisse">Plus grosse baisse de prix</option>
   <option value="recent">Plus récents</option>
   <option value="retire" hidden>Retirées récemment</option>
  </select>
  <div class="msel" id="secteur"><button type="button" id="btn-secteur" aria-haspopup="true" aria-expanded="false" aria-controls="liste-secteur">Tous les secteurs</button><div class="msel-p" id="liste-secteur" hidden></div></div>
  <button class="partage" id="btn-partager" type="button" aria-label="Partager l'aperçu du Radar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span id="txt-partager">Partager</span></button>
 </div>
</header>

<section class="panneau" id="panneau-journal" hidden><div class="boite" id="journal"></div></section>
<section class="kpis" id="kpis" hidden></section>
<section class="bande-notes" id="bande-notes" hidden><div><span id="bande-notes-txt"></span><button class="btn" id="btn-notes" type="button" hidden></button></div></section>

<main id="grille">
 <div class="accueil" id="accueil">
  <p id="message">Les données du Radar sont dans ton Google Drive. Connecte-toi pour les afficher.</p>
  <button class="btn p" id="btn-connexion" type="button">Se connecter avec Google</button>
  <p><button class="lienb" id="btn-autre-compte" type="button" hidden>Utiliser un autre compte</button></p>
 </div>
</main>
<p class="note" id="pied" hidden></p>

<dialog class="pp" id="pp" aria-labelledby="pp-titre">
 <h2 id="pp-titre">Partager</h2>
 <div class="seg" role="group" aria-label="Quoi partager"><button type="button" id="pp-m-un" aria-pressed="true">Cette fiche</button><button type="button" id="pp-m-sel" aria-pressed="false">Une sélection</button></div>
 <div class="pp-fiche" id="pp-un"></div>
 <div id="pp-sel" hidden>
  <div class="pp-outils"><span id="pp-compte"></span><button class="lienb" type="button" id="pp-tout">Tout cocher</button><button class="lienb" type="button" id="pp-rien">Aucune</button></div>
  <div class="pp-liste" id="pp-liste"></div>
 </div>
 <label><input type="checkbox" id="pp-cr" checked><span>Joindre une copie du Cruncher<small>Copie figée au moment de l'envoi. Ton original ne bouge pas.</small></span></label>
 <label id="pp-l-notes" hidden><input type="checkbox" id="pp-notes" checked><span>Joindre mes notes</span></label>
 <label class="champ" for="pp-qui">Pour qui ? (pour t'y retrouver)<input type="text" id="pp-qui" maxlength="80" placeholder="ex. Marc — club d'investisseurs"></label>
 <div class="st" id="pp-etat" aria-live="polite"></div>
 <div class="lien" id="pp-lien" hidden></div>
 <div class="act"><button class="btn" id="pp-annuler" type="button">Annuler</button><button class="btn" id="pp-reessayer" type="button" hidden>Réessayer</button><button class="btn p" id="pp-envoyer" type="button" disabled>Envoyer…</button></div>
</dialog>

<script>
"use strict";
// ---------------------------------------------------------------- réglages
// Identifiant client OAuth (étiquette publique, pas une clé — décision 1-C du 29 sept. 2026).
const CLIENT_ID = "970382559280-ohc88l54o2iigejropfleutrv2qkfjbf.apps.googleusercontent.com";
// Dossier « Radar immobilier / 03 - Donnees machine » (Drive de François).
const DOSSIER_DONNEES = "1pW-gd80-oXDWSr4lIMp8Oswp1bcjza1L";
const NOM_DONNEES = "donnees.json";
const NOM_JOURNAL = "journal_runs.json";
// Lecture du Drive + écriture LIMITÉE aux fichiers créés par le portail (voie étroite, décision du 5 oct. 2026).
const PORTEE_ECRITURE = "https://www.googleapis.com/auth/drive.file";
const PORTEE = "https://www.googleapis.com/auth/drive.readonly " + PORTEE_ECRITURE;
const FORMATS_CONNUS = ["1"];
// Lien envoyé par le bouton « Partager » : l'aperçu invité (lecture seule, sans connexion Google).
// Le lien du portail lui-même ne montrerait rien à un invité : les données sont dans le Drive de François.

// Adresse « /exec » du script Google Radar_Partage (application Web publiée par François). Vide = partage pas encore branché.

// ---------------------------------------------------------------- formatage (aucun calcul)
const nbFr = new Intl.NumberFormat("fr-CA", {maximumFractionDigits: 0});
const nb1 = new Intl.NumberFormat("fr-CA", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const estNb = (v) => typeof v === "number" && isFinite(v);
const $$ = (v) => estNb(v) ? nbFr.format(v) + " $" : "—";
const $mille = (v) => estNb(v) ? nbFr.format(Math.round(v / 1000) * 1000) + " $" : "—";
const signe$ = (v) => estNb(v) ? (v >= 0 ? "+" : "−") + nbFr.format(Math.abs(Math.round(v / 1000) * 1000)) + " $" : "—";
const pct = (v) => estNb(v) ? nb1.format(v * 100) + " %" : "—";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateCourte = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso);
  return isNaN(d) ? esc(iso) : d.toLocaleDateString("fr-CA", {day: "numeric", month: "short"});
};
const dateHeure = (iso) => {
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleDateString("fr-CA", {day: "numeric", month: "short"}) + ", "
    + d.toLocaleTimeString("fr-CA", {hour: "2-digit", minute: "2-digit"});
};

// Rester connecté (chantier Portail, étape 2 — 7 oct. 2026). Sans serveur, Google ne remet à une page que des
// jetons d'une heure. Trois moyens, sans aucun droit nouveau :
//  1. le jeton est redemandé « en discret » 5 minutes avant l'échéance (une fenêtre Google s'ouvre et se referme
//     seule) ; si le navigateur bloque cette fenêtre, la demande part au prochain toucher de la page ;
//  2. l'adresse du compte est retenue dans le navigateur (ce n'est pas un secret) : Google ne redemande plus
//     de choisir le compte ;
//  3. au retour après expiration : un essai sans clic, sinon un seul bouton.
const CLE_JETON = "radar_jeton", CLE_COMPTE = "radar_compte";
const MARGE_RENOUV = 5 * 60000;
let droitEcriture = false;
let expireA = 0, attenteJeton = null, minuterie = null, dernierEssai = 0, chargement = false;

function lireJetonMemorise() {
  try {
    const j = JSON.parse(sessionStorage.getItem(CLE_JETON) || "null");
    if (j && j.expire > Date.now() + 60000) { expireA = j.expire; droitEcriture = !!j.ecriture; return j.valeur; }
  } catch (e) {}
  return null;
}
function memoriserJeton(valeur, secondes) {
  expireA = Date.now() + secondes * 1000;
  try { sessionStorage.setItem(CLE_JETON, JSON.stringify({valeur, expire: expireA, ecriture: droitEcriture})); } catch (e) {}
}
function oublierJeton() { jeton = null; expireA = 0; clearTimeout(minuterie); try { sessionStorage.removeItem(CLE_JETON); } catch (e) {} }
function compteMemorise() { try { return localStorage.getItem(CLE_COMPTE) || ""; } catch (e) { return ""; } }
function memoriserCompte(c) { try { if (c) localStorage.setItem(CLE_COMPTE, c); else localStorage.removeItem(CLE_COMPTE); } catch (e) {} }

function chargerGIS() {
  return new Promise((ok, ko) => {
    if (window.google && google.accounts && google.accounts.oauth2) return ok();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = ok; s.onerror = () => ko(new Error("Service de connexion Google injoignable."));
    document.head.appendChild(s);
  });
}

// Une seule demande à la fois. discret = renouvellement (on n'attend pas longtemps) ; choisir = changer de compte.
function demanderJeton(discret, choisir) {
  if (attenteJeton) return attenteJeton;
  dernierEssai = Date.now();
  const p = chargerGIS().then(() => new Promise((ok, ko) => {
    const compte = choisir ? "" : compteMemorise();
    let tardif = false;
    const garde = setTimeout(() => { tardif = true; ko(Object.assign(new Error("Google n'a pas répondu."), {type: "delai"})); }, discret ? 20000 : 180000);
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: PORTEE,
      callback: (r) => {
        clearTimeout(garde);
        if (r.error || !r.access_token) return ko(Object.assign(new Error("Connexion refusée ou annulée (" + (r.error || "sans jeton") + ")."), {type: "refus"}));
        jeton = r.access_token;
        try { droitEcriture = google.accounts.oauth2.hasGrantedAllScopes(r, PORTEE_ECRITURE); } catch (e) { droitEcriture = false; }
        memoriserJeton(jeton, Number(r.expires_in) || 3600); dernierEssai = 0; planifierRenouvellement(); ok(jeton);
        if (tardif && !donnees) charger();
      },
      error_callback: (e) => {
        clearTimeout(garde);
        const type = (e && e.type) || "fenetre";
        if (type === "popup_failed_to_open") dernierEssai = 0;   // bloquée : le prochain toucher réessaie tout de suite
        ko(Object.assign(new Error(type === "popup_failed_to_open" ? "Le navigateur a bloqué la fenêtre Google. Touche le bouton pour continuer."
          : type === "popup_closed" ? "Fenêtre Google fermée avant la fin." : "La connexion Google n'a pas abouti."), {type}));
      },
    });
    client.requestAccessToken(choisir ? {prompt: "select_account"} : compte ? {prompt: "", hint: compte} : {});
  }));
  attenteJeton = p;
  const fin = () => { if (attenteJeton === p) attenteJeton = null; };
  p.then(fin, fin);
  return p;
}

function planifierRenouvellement() {
  clearTimeout(minuterie);
  if (!jeton || !expireA) return;
  minuterie = setTimeout(renouveler, Math.max(expireA - Date.now() - MARGE_RENOUV, 1000));
}
// Appelé par la minuterie ET à chaque toucher de la page (un toucher est ce qui autorise la fenêtre Google).
function renouveler() {
  if (!jeton || document.hidden || !compteMemorise()) return;
  if (expireA - Date.now() > 2 * MARGE_RENOUV || Date.now() - dernierEssai < 60000) return;
  demanderJeton(true).catch(() => {});
}

function ecranConnexion(txt) {
  const c = compteMemorise();
  message(txt);
  if (!$("btn-connexion")) return;
  $("btn-connexion").hidden = false; $("btn-connexion").textContent = c ? "Continuer (" + c + ")" : "Se connecter avec Google";
  $("btn-autre-compte").hidden = !c;
}
async function connecter(choisir) {
  if (!CLIENT_ID) { message("Portail pas encore relié à Google : l'identifiant client OAuth reste à installer (voir la fiche du chantier)."); return; }
  try { await demanderJeton(false, choisir === true); } catch (e) { ecranConnexion(e.message); return; }
  charger();
}
function apprendreCompte() {
  drive("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)").then((r) => r.json())

// ---------------------------------------------------------------- lecture Drive (lecture seule)
async function drive(url, repris) {
  if (attenteJeton) await attenteJeton.catch(() => {});
  const r = await fetch(url, {headers: {Authorization: "Bearer " + jeton}});
  if (r.status === 401) {
    if (!repris && compteMemorise()) {
      let ok = false;
      try { await demanderJeton(true); ok = true; } catch (e) {}
      if (ok) return drive(url, true);
    }
    oublierJeton(); throw Object.assign(new Error("Session expirée."), {reconnecter: true});
  }
  if (r.status === 403 || r.status === 404) throw new Error("Ce compte Google n'a pas accès aux données du Radar.");
  if (!r.ok) throw new Error("Drive a répondu " + r.status + ".");
  return r;
}
async function lireFichier(nom) {
  const q = encodeURIComponent(`'${DOSSIER_DONNEES}' in parents and name = '${nom}' and trashed = false`);
  const liste = await (await drive(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=1&supportsAllDrives=true&includeItemsFromAllDrives=true`)).json();
  if (!liste.files || !liste.files.length) return null;
  return (await drive(`https://www.googleapis.com/drive/v3/files/${liste.files[0].id}?alt=media&supportsAllDrives=true`)).json();
}

async function charger() {

    if (e.reconnecter) ecranConnexion("Session expirée. Un toucher suffit pour revenir.");
    else { $("btn-connexion").hidden = false; $("btn-connexion").textContent = "Réessayer"; $("btn-autre-compte").hidden = !compteMemorise(); message(e.message); }
  } finally { chargement = false; }
}

// ---- État de l'annonce et chiffres sur le prix courant
// Le bloc « marche » vient de la collecte : statut (active, retiree, promesse_conditionnelle), prix_actuel,
// prix_initial, variation_prix (négatif = baisse), historique_prix. Les chiffres de l'analyse datent du jour de
// l'analyse : si le prix a changé depuis, prix par porte, MRB et écarts sont refaits ici sur le prix courant.
function vue(im) {
  const m = im.marche || {}, ve = im.valeur_economique || {}, ec = im.ecart || {}, mrb = im.mrb || {}, P = im.portraits || {};
  const p0 = im.prix_demande, p = estNb(m.prix_actuel) ? m.prix_actuel : p0, n = im.nb_logements;
  const change = estNb(p) && p !== p0;
  const rev = (x) => (P[x] && typeof P[x] === "object" && estNb(P[x].revenus_bruts) && P[x].revenus_bruts > 0) ? P[x].revenus_bruts : null;
  const mrbSur = (x) => (change && rev(x)) ? p / rev(x) : mrb[x];
  const ecSur = (x) => (change && estNb(ve[x])) ? ve[x] - p : ec[x];
  const h = Array.isArray(m.historique_prix) ? m.historique_prix : [];
  const v = estNb(m.variation_prix) ? m.variation_prix : 0;
  return {
    prix: p, change,
    ppp: (change && estNb(n) && n > 0) ? Math.round(p / n) : im.prix_par_porte_demande,
    mrbA: mrbSur("A"), mrbC: mrbSur("C"), ecA: ecSur("A"), ecC: ecSur("C"),
    variation: v, prixInitial: m.prix_initial, dateVariation: v && h.length ? h[h.length - 1].date : null,
    retiree: m.statut === "retiree", retireeLe: m.retiree_le,
    promesse: m.statut === "promesse_conditionnelle" || m.promesse_conditionnelle === true,
  };
}

// ---- Filtres : quatre pastilles (une seule active à la fois) et les secteurs cochés (aucun = tous).
const CLE_SECTEURS = "radar_secteurs";
let filtre = "actives", triAvantArchives = null;
let secteursChoisis = new Set();
if (!INVITE) { try { secteursChoisis = new Set(JSON.parse(localStorage.getItem(CLE_SECTEURS) || "[]")); } catch (e) {} }
const FILTRES = [
  ["actives", "actives", "active", (i, w) => !w.retiree],
  ["nouvelles", "nouvelles", "nouvelle", (i, w) => !w.retiree && i.date_analyse === aujourdhui()],
  ["baisses", "baisses", "baisse", (i, w) => !w.retiree && w.variation < 0],
  ["archives", "archivées", "archivée", (i, w) => w.retiree],
];
const duSecteur = (i) => !secteursChoisis.size || secteursChoisis.has(i.secteur);

function construireSecteurs(ims) {
  const compte = {};
  ims.forEach((i) => { if (i.secteur) compte[i.secteur] = (compte[i.secteur] || 0) + 1; });
  const noms = Object.keys(compte).sort((a, b) => a.localeCompare(b, "fr"));
  // Un secteur retenu qui n'existe plus dans les données ne doit pas vider la liste.
  secteursChoisis = new Set([...secteursChoisis].filter((s) => compte[s]));
  $("liste-secteur").innerHTML = `<label class="tous"><input type="checkbox" data-secteur=""><span>Tous les secteurs</span><small>${ims.length}</small></label>`
    + noms.map((s) => `<label><input type="checkbox" data-secteur="${esc(s)}"><span>${esc(s)}</span><small>${compte[s]}</small></label>`).join("")
    + '<div class="fin"><button class="btn p" type="button" id="fermer-secteur">Appliquer</button></div>';
  majSecteurs();
}
function majSecteurs() {
  const n = secteursChoisis.size;
  $("btn-secteur").textContent = (n === 0 ? "Tous les secteurs" : n === 1 ? [...secteursChoisis][0] : n + " secteurs") + " ▾";
  $("liste-secteur").querySelectorAll("input[data-secteur]").forEach((c) => { c.checked = c.dataset.secteur ? secteursChoisis.has(c.dataset.secteur) : n === 0; });
  if (!INVITE) { try { localStorage.setItem(CLE_SECTEURS, JSON.stringify([...secteursChoisis])); } catch (e) {} }
}
function ouvrirSecteurs(ouvert) {
  $("liste-secteur").hidden = !ouvert; $("btn-secteur").setAttribute("aria-expanded", ouvert ? "true" : "false");
}
function choisirFiltre(f) {
  const tri = $("tri"), optRetire = tri.querySelector('option[value="retire"]');
  if (f === "archives" && filtre !== "archives") { triAvantArchives = tri.value; optRetire.hidden = false; tri.value = "retire"; }
  if (f !== "archives" && filtre === "archives") { optRetire.hidden = true; tri.value = triAvantArchives || "ecartC"; }
  filtre = f;
  afficherCartes();
}

function trier(ims) {
  const t = $("tri").value, bas = (v) => (estNb(v) ? 0 : 1);
  const W = new Map(ims.map((i) => [i, vue(i)])), w = (i) => W.get(i);
  const recent = (a, b) => String(b.date_analyse || "").localeCompare(String(a.date_analyse || ""));
  const croissant = (cle) => (a, b) => bas(w(a)[cle]) - bas(w(b)[cle]) || (w(a)[cle] ?? 0) - (w(b)[cle] ?? 0) || recent(a, b);
  const decroissant = (cle) => (a, b) => bas(w(a)[cle]) - bas(w(b)[cle]) || (w(b)[cle] ?? 0) - (w(a)[cle] ?? 0) || recent(a, b);
  const cles = {
    ecartC: decroissant("ecC"), ecartA: decroissant("ecA"),
    ppp: croissant("ppp"), mrbA: croissant("mrbA"), mrbC: croissant("mrbC"),
    baisse: (a, b) => w(a).variation - w(b).variation || recent(a, b),
    retire: (a, b) => String(w(b).retireeLe || "").localeCompare(String(w(a).retireeLe || "")) || recent(a, b),
    recent,
  };
  return [...ims].sort(cles[t] || cles.ecartC);
}

function afficherCartes() {
  const duCoin = (donnees.immeubles || []).filter(duSecteur).map((i) => [i, vue(i)]);
  // Pastilles : le compte de chaque filtre, pour les secteurs cochés.
  $("kpis").innerHTML = FILTRES.map(([cle, pluriel, singulier, test]) => {
    const n = duCoin.filter(([i, w]) => test(i, w)).length;
    return `<button class="puce${cle === filtre ? " on" : ""}${cle === "baisses" && n ? " v" : ""}" type="button" data-filtre="${cle}" aria-pressed="${cle === filtre}"><b>${n}</b>${n > 1 ? pluriel : singulier}</button>`;
  }).join("");
  const test = (FILTRES.find((f) => f[0] === filtre) || FILTRES[0])[3];
  const ims = duCoin.filter(([i, w]) => test(i, w)).map(([i]) => i);
  const libTri = $("tri").selectedOptions[0].textContent.replace(/^Trier : /, "");
  $("sous-titre").textContent = (INVITE ? "Partagé par François · " : "") + ims.length + " immeuble" + (ims.length > 1 ? "s" : "") + " · trié par " + libTri;
  const grille = $("grille");
  grille.querySelectorAll(".carte").forEach((c) => c.remove());
  if (!ims.length) { message("Aucun immeuble pour ce filtre."); return; }
  $("accueil").hidden = true;
  grille.insertAdjacentHTML("beforeend", trier(ims).map(carte).join(""));
  majNotes();
}

function typo(t) {
  if (!t || typeof t !== "object") return "";
  const p = Object.entries(t).map(([k, n]) => `${n} × ${esc(String(k).replace(".5", "½"))}`);
  return p.length ? " (" + p.join(", ") + ")" : "";
}

function ligneLoyer(lo) {
  if (!lo || !estNb(lo.A)) return null;
  let h = `Loyer moyen par porte : <b>${$$(lo.A)}/mois</b> actuel <span class="chk" title="Crochet posé par François après le rent roll — saisie à venir (Google Sheet D2)"></span>`;
  if (estNb(lo.C)) h += ` → <b>${$$(lo.C)}/mois</b> potentiel (${estNb(lo.ecart) ? (lo.ecart >= 0 ? "+" : "−") + $$(Math.abs(lo.ecart)) : "—"})`;
  return h;
}

function carte(im) {
  const w = vue(im), ve = im.valeur_economique || {}, ec = {A: w.ecA, C: w.ecC}, mrb = {A: w.mrbA, C: w.mrbC};
  const adresse = String(im.adresse || "Adresse inconnue");
  const courte = adresse.replace(/,\s*Montr[ée]al\s*$/i, "");
  const q = encodeURIComponent(adresse);
  const tag = [im.provenance === "centris" && im.no_inscription ? "Centris " + esc(im.no_inscription) : esc(im.id || ""),
               dateCourte(im.date_analyse)].filter(Boolean).join(" · ");
  // État de l'annonce : étiquettes, et variation de prix logée dans la case du prix demandé.
  const etiq = [w.retiree ? "Retirée de Centris" + (w.retireeLe ? " le " + dateCourte(w.retireeLe) : "") : "",
                w.promesse ? "Promesse d'achat conditionnelle" : ""].filter(Boolean);
  const varPrix = w.variation
    ? `<div class="var${w.variation > 0 ? " h" : ""}">${w.variation < 0 ? "Baisse" : "Hausse"} de ${$$(Math.abs(w.variation))}${w.dateVariation ? `<small>${dateCourte(w.dateVariation)}</small>` : ""}</div>` : "";
  const avant = w.variation && estNb(w.prixInitial) && w.prixInitial !== w.prix ? `<div class="av">${$$(w.prixInitial)}</div>` : "";

  // Microfiche : la ligne du loyer est rendue depuis le champ structuré (crochet ✓), le reste tel quel.
  const loyer = ligneLoyer(im.loyer_moyen_porte);
  const mf = (im.microfiche || []).map((l) => (/^Loyer moyen par porte/.test(l) && loyer) ? loyer : esc(l));

  const ecCase = (v, lib) => estNb(v)
    ? `<td class="${v >= 0 ? "pos" : "neg"}"><span class="l">${lib}</span><b>${signe$(v)}</b></td>` : "<td></td>";

  const P = im.portraits || {}, ligne = (lib, cle, f) =>
    `<tr><td>${lib}</td>${["A", "B", "C"].map((p) => `<td>${P[p] && typeof P[p] === "object" ? f(P[p][cle]) : "—"}</td>`).join("")}</tr>`;
  const n0 = (v) => estNb(v) ? nbFr.format(v) : "—";
  const avert = [...(im.red_flags || []), ...(im.alertes || [])].filter((x) => x && x !== "…");
  const payable = im.prix_payable && estNb(im.prix_payable.sur_revenus_actuels)
    ? `<p>Prix payable (TGA ${pct(im.prix_payable.tga)}, revenus actuels) : ${$$(Math.round(im.prix_payable.sur_revenus_actuels))}</p>` : "";
  const cr = im.cruncher || {};
  const lienCr = cr.drive_id ? `https://drive.google.com/file/d/${encodeURIComponent(cr.drive_id)}/view` : null;

  return `<article class="carte${w.retiree ? " arch" : ""}">
  <div class="haut"><div class="tag" title="Date de l'analyse">${tag}</div>${INVITE ? "" : blocEtape(im)}</div>
  ${etiq.length ? `<div class="etiq">${etiq.map((e) => `<span>${esc(e)}</span>`).join("")}</div>` : ""}

// Notes de François par immeuble (clé = id), lues et écrites dans la feuille Google « Radar_Saisies ».
let saisies = {};

// ---------------------------------------------------------------- notes (chantier Portail, étape 3)
// La feuille est CRÉÉE PAR LE PORTAIL à la première note (c'est ce qui lui donne le droit d'y écrire, et dans
// aucune autre feuille). Elle porte une étiquette invisible (appProperties) : le portail la retrouve même
// renommée ou déplacée. Colonnes : id | adresse | note | modifie_le | etape_entonnoir (réservée, non affichée).
// Rien ne se perd : chaque frappe est gardée dans le navigateur (brouillon) tant que Google n'a pas confirmé ;
// si la note a été changée sur un autre appareil entre-temps, les deux textes sont gardés bout à bout.
const NOM_SAISIES = "Radar_Saisies", ENTETE_SAISIES = ["id", "adresse", "note", "modifie_le", "etape_entonnoir"];
const SHEETS = "https://sheets.googleapis.com/v4/spreadsheets/", CLE_BROUILLONS = "radar_brouillons";

// notesEtat : attente | pret | sans-droit | api-fermee | erreur
let feuilleId = null, notesEtat = "attente", creationFeuille = null, fileNotes = Promise.resolve();
const noteSale = {}, noteMinut = {}, noteMsg = {};

function brouillons() { try { return JSON.parse(localStorage.getItem(CLE_BROUILLONS) || "{}") || {}; } catch (e) { return {}; } }
function poserBrouillon(id, note, base) {
  try { const b = brouillons(); if (note === null) delete b[id]; else b[id] = {note, base: base || ""}; localStorage.setItem(CLE_BROUILLONS, JSON.stringify(b)); } catch (e) {}
}

async function appelGoogle(url, opts, repris) {
  if (attenteJeton) await attenteJeton.catch(() => {});
  const o = opts || {};
  const r = await fetch(url, {method: o.method || "GET", body: o.body ? JSON.stringify(o.body) : undefined,
    headers: Object.assign({Authorization: "Bearer " + jeton}, o.body ? {"Content-Type": "application/json"} : {})});
  if (r.status === 401 && !repris && compteMemorise()) {
    let ok = false;
    try { await demanderJeton(true); ok = true; } catch (e) {}
    if (ok) return appelGoogle(url, opts, true);
  }
  if (!r.ok) {
    let detail = ""; try { detail = JSON.stringify(await r.json()); } catch (e) {}
    throw Object.assign(new Error("Google a répondu " + r.status + "."), {status: r.status, detail});
  }
  return r.json();
}
const apiFermee = (e) => e && e.status === 403 && /SERVICE_DISABLED|has not been used|is disabled|accessNotConfigured/i.test(e.detail || "");

async function trouverFeuille() {
  const q = encodeURIComponent("appProperties has { key='radar' and value='saisies' } and trashed = false");
  const l = await appelGoogle(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=createdTime&pageSize=5`);
  return l.files && l.files.length ? l.files[0].id : null;
}
function assurerFeuille() {
  if (feuilleId) return Promise.resolve(feuilleId);
  if (!creationFeuille) {
    creationFeuille = (async () => {
      let id = await trouverFeuille();
      if (!id) {
        id = (await appelGoogle("https://www.googleapis.com/drive/v3/files?fields=id", {method: "POST",
          body: {name: NOM_SAISIES, mimeType: "application/vnd.google-apps.spreadsheet", appProperties: {radar: "saisies"}}})).id;
      }
      feuilleId = id;
      return id;
    })();
    const fin = () => { creationFeuille = null; };
    creationFeuille.then(fin, fin);
  }
  return creationFeuille;
}
async function lireFeuille() {
  const v = await appelGoogle(SHEETS + feuilleId + "/values/A:E?majorDimension=ROWS");
  const lignes = v.values || [];
  if (!lignes.length || String(lignes[0][0] || "") !== "id") {
    if (!lignes.length) await appelGoogle(SHEETS + feuilleId + "/values/A1:E1?valueInputOption=RAW", {method: "PUT", body: {values: [ENTETE_SAISIES]}});
  }
  return lignes;
}
const versSaisies = (lignes) => {
  const s = {};
  lignes.forEach((l, i) => { const id = String(l[0] || ""); if (id && !(i === 0 && id === "id")) s[id] = {note: String(l[2] || ""), modifie: String(l[3] || ""), etape: String(l[4] || ""), ligne: i + 1}; });
  return s;
};

async function chargerNotes() {
  if (!droitEcriture) { notesEtat = "sans-droit"; majNotes(); return; }
  try {
    if (!feuilleId) feuilleId = await trouverFeuille();
    const lues = feuilleId ? versSaisies(await lireFeuille()) : {};
    // On ne touche pas à une note en cours de frappe.
    Object.keys(saisies).forEach((id) => { if (noteSale[id]) lues[id] = Object.assign({}, lues[id], {note: saisies[id].note, base: saisies[id].base, modifie: lues[id] ? lues[id].modifie : ""}); });
    // Ni à un statut choisi qui n'est pas encore confirmé par Google.
    Object.keys(etapeSale).forEach((id) => { lues[id] = Object.assign({note: "", modifie: "", etape: ""}, lues[id], {etape: saisies[id] ? saisies[id].etape : ""}); });
    saisies = lues;
    notesEtat = "pret";
    // Brouillons restés dans ce navigateur (page fermée avant la confirmation de Google) : on les reprend.
    const b = brouillons();
    Object.keys(b).forEach((id) => {
      if (noteSale[id]) return;
      const br = b[id] && typeof b[id] === "object" ? b[id] : {note: String(b[id] || ""), base: ""};
      if ((saisies[id] ? saisies[id].note : "") === br.note) { poserBrouillon(id, null); return; }
      saisies[id] = Object.assign({note: "", modifie: "", etape: ""}, saisies[id], {base: br.base, note: br.note});
      noteSale[id] = true; planifierNote(id, 300);
    });
  } catch (e) {
    if (e.status === 404) feuilleId = null;
    notesEtat = apiFermee(e) ? "api-fermee" : "erreur";
  }
  majNotes();
}

function planifierNote(id, delai) {
  clearTimeout(noteMinut[id]);
  noteMinut[id] = setTimeout(() => enregistrerNote(id), delai === undefined ? DELAI_NOTE : delai);
}
function enregistrerNote(id) {
  clearTimeout(noteMinut[id]); delete noteMinut[id];
  if (!noteSale[id] || notesEtat !== "pret") return fileNotes;
  // Une écriture à la fois, dans l'ordre : jamais deux lignes pour le même immeuble.
  fileNotes = fileNotes.then(() => ecrireNote(id)).catch(() => {});
  return fileNotes;
}
async function ecrireNote(id) {
  if (!noteSale[id]) return;
  const s = saisies[id] || (saisies[id] = {note: "", modifie: "", etape: ""});
  let texte = s.note;
  noteMsg[id] = {txt: "Enregistrement…"}; majEtatNote(id);
  try {
    await assurerFeuille();
    // On relit la feuille juste avant d'écrire : la ligne se trouve par l'id (la feuille peut avoir été triée),
    // et on voit si la note a changé ailleurs depuis l'affichage.
    const lignes = await lireFeuille();
    let n = -1;
    for (let i = 0; i < lignes.length; i++) if (String(lignes[i][0] || "") === id) { n = i + 1; break; }
    const distante = n > 0 ? String(lignes[n - 1][2] || "") : "";
    const base = s.base !== undefined ? s.base : "";
    let fusion = false;
    if (n > 0 && distante !== base && distante.trim() && distante.trim() !== texte.trim() && !texte.includes(distante.trim())) {
      texte = (texte.trim() ? texte.trim() + "\n\n" : "") + "[Écrit sur un autre appareil]\n" + distante.trim();
      fusion = true;
    }
    const quand = new Date().toISOString();
    if (n > 0) {
      await appelGoogle(SHEETS + feuilleId + "/values/" + encodeURIComponent("C" + n + ":D" + n) + "?valueInputOption=RAW", {method: "PUT", body: {values: [[texte, quand]]}});
    } else {
      const im = (donnees.immeubles || []).find((x) => x.id === id) || {};
      await appelGoogle(SHEETS + feuilleId + "/values/A:E:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS", {method: "POST", body: {values: [[id, String(im.adresse || ""), texte, quand, ""]]}});
    }
    // La frappe a pu continuer pendant l'écriture : dans ce cas on repart pour un tour.
    s.base = texte; s.modifie = quand;
    if (fusion) { s.note = texte; const z = zoneNote(id); if (z) { z.value = texte; ajusterNote(z); } }
    if (!fusion && s.note !== texte) { planifierNote(id); noteMsg[id] = {txt: "Enregistrement…"}; }
    else { delete noteSale[id]; poserBrouillon(id, null); noteMsg[id] = {txt: (fusion ? "Réunie avec une note écrite sur un autre appareil · " : "Enregistré · ") + dateHeure(quand)}; }
  } catch (e) {
    if (e.status === 404) feuilleId = null;
    if (apiFermee(e)) { notesEtat = "api-fermee"; majNotes(); }
    noteMsg[id] = {txt: "Pas encore enregistré (gardé dans ce navigateur). Nouvel essai en cours…", ko: true};
    planifierNote(id, 15000);
  }
  majEtatNote(id);
}

// ---- Statut de l'immeuble dans l'entonnoir (colonne « etape_entonnoir » de la même feuille).
// La liste se change ici, à un seul endroit. Le premier (vide dans la feuille) est l'état de départ.
// Un statut déjà enregistré qui ne serait plus dans la liste reste affiché tel quel.
// LISTE PROVISOIRE (9 oct. 2026) : François ne l'aime pas telle quelle ; elle est là pour voir la pastille
// fonctionner. À REVOIR ET COMPLÉTER AVEC LUI APRÈS LA V1 (voir le plan directeur, §8, CRM / entonnoir).
const ETAPES = ["Nouveau", "Vu", "À analyser", "Chiffres à confirmer", "Questions au courtier", "Offre à déposer", "PA acceptée", "Écarté"];

    if (n > 0) {
      await appelGoogle(SHEETS + feuilleId + "/values/" + encodeURIComponent("E" + n) + "?valueInputOption=RAW", {method: "PUT", body: {values: [[v]]}});
    } else {

const zoneNote = (id) => document.querySelector('textarea[data-note="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');

}

  $("pp-liste").innerHTML = fichesAffichees().map((i) => {
    const w = vue(i);
    return `<label><input type="checkbox" data-choix="${esc(i.id || "")}"><span><b>${esc(adresseCourte(i))}</b><small>${esc(i.secteur || "")} · ${estNb(i.nb_logements) ? i.nb_logements + " portes" : "?"} · ${$$(w.prix)}${w.retiree ? " · retirée" : ""}</small></span></label>`;
  }).join("");
  majPartage();
  const d = $("pp"); if (d.showModal) d.showModal(); else d.setAttribute("open", "");
}
function fermerPartage() { ps = null; const d = $("pp"); if (d.close) d.close(); else d.removeAttribute("open"); }

function majPartage() {
  const e = ps; if (!e) return;
  const sel = e.mode === "sel" || !e.base;
  $("pp-m-un").hidden = !e.base;
  $("pp-m-un").setAttribute("aria-pressed", String(!sel)); $("pp-m-sel").setAttribute("aria-pressed", String(sel));
  $("pp-un").hidden = sel; $("pp-sel").hidden = !sel;
  if (e.base) {
    const im = e.base;
    $("pp-un").innerHTML = `<b>${esc(adresseCourte(im))}</b><small>${esc(im.secteur || "")} · ${estNb(im.nb_logements) ? im.nb_logements + " portes" : "?"}${im.no_inscription ? " · Centris " + esc(im.no_inscription) : ""}</small>`;
  }
  $("pp-liste").querySelectorAll("input[data-choix]").forEach((c) => { c.checked = e.choisis.has(c.dataset.choix); });
  const ids = idsAEnvoyer(e);
  $("pp-compte").textContent = ids.length + " fiche" + (ids.length > 1 ? "s" : "") + " cochée" + (ids.length > 1 ? "s" : "");
  const notesDispo = ids.some((id) => noteDe({id}));
  $("pp-l-notes").hidden = !notesDispo;
  ["pp-m-un", "pp-m-sel", "pp-cr", "pp-notes", "pp-qui"].forEach((id) => { $(id).disabled = e.envoye; });
  $("pp-liste").querySelectorAll("input").forEach((c) => { c.disabled = e.envoye; });

  let t = "", pret = false;
  if (!URL_SCRIPT_PARTAGE) t = "Le partage n'est pas encore branché : le script Google « Radar_Partage » reste à publier (voir la fiche du chantier).";
  else if (notesEtat === "sans-droit") t = "Le partage s'inscrit dans ta feuille Radar_Saisies : touche d'abord « Activer les notes » en haut de la page.";
  else if (notesEtat !== "pret") t = "Lecture de ta feuille Radar_Saisies…";
  else if (!ids.length) t = "Coche au moins une fiche.";
  else { pret = true; t = "Un seul lien partira. La personne l'ouvre sans compte ni autorisation."; }
  if (e.envoye) {
    pret = false;
    t = e.erreur ? "⚠ " + e.erreur
      : e.ecrit ? "Lien actif. " + (e.avis || "Envoyé.") + " " + (e.copie || "")
      : "Inscription du lien dans ta feuille…";
  }
  $("pp-etat").textContent = t;
  $("pp-lien").hidden = !e.envoye || !e.lien; $("pp-lien").textContent = e.lien || "";
  $("pp-envoyer").hidden = e.envoye; $("pp-envoyer").disabled = !pret;
  $("pp-reessayer").hidden = !(e.envoye && e.erreur);
  $("pp-annuler").textContent = e.envoye ? "Fermer" : "Annuler";
}
const idsAEnvoyer = (e) => (e.mode === "sel" || !e.base) ? [...e.choisis] : [String(e.base.id)];

async function ecrireEtPreparer(e) {
  e.erreur = ""; majPartage();
  try { await inscrirePartage(e); e.ecrit = true; }
  catch (err) {
    if (err && err.status === 404) { feuilleId = null; ongletPartagesPret = false; }
    e.erreur = "Le lien n'a pas pu être inscrit dans ta feuille : il ne s'ouvrira pas chez la personne. Touche « Réessayer »."
      + (apiFermee(err) ? " (Google Sheets API fermée.)" : "");
  }
  if (ps === e) majPartage();
  if (!e.ecrit || !e.avecCr) return;
  // Le script fait tout de suite la copie figée du Cruncher (sinon il la fera à la première demande de l'invité).
  e.copie = "Copie du Cruncher en préparation…"; if (ps === e) majPartage();
  try {
    const r = await (await fetch(URL_SCRIPT_PARTAGE + "?p=" + encodeURIComponent(e.code) + "&preparer=1")).json();
    e.copie = r && r.ok ? "Copie du Cruncher prête." : "La copie du Cruncher sera faite à l'ouverture du lien.";
  } catch (err) { e.copie = "La copie du Cruncher sera faite à l'ouverture du lien."; }
  if (ps === e) majPartage();
}

// Appelé directement par le toucher sur « Envoyer » : l'inscription part en même temps que le menu de partage,
// sans rien attendre avant (Android refuse le menu si le geste est « consommé » par une attente).
async function envoyerPartage() {
  const e = ps; if (!e || e.envoye) return;
  const ids = idsAEnvoyer(e); if (!ids.length) return;
  e.choisis = new Set(ids); e.avecCr = $("pp-cr").checked; e.avecNotes = !$("pp-l-notes").hidden && $("pp-notes").checked;
  e.pourQui = $("pp-qui").value.trim(); e.code = nouveauCode(); e.lien = lienDe(e.code); e.envoye = true;
  const travail = ecrireEtPreparer(e);
  let titre, texte;
  if (ids.length === 1) {
    const im = ficheParId(ids[0]) || e.base || {};
    titre = adresseCourte(im);
    texte = titre + " — " + (im.secteur || "") + (estNb(im.nb_logements) ? ", " + im.nb_logements + " portes" : "")
      + (im.url ? "\nCentris : " + im.url : "") + "\nFiche Radar :";
  } else {
    titre = "Radar immobilier — " + ids.length + " immeubles";
    texte = "Sélection de " + ids.length + " immeubles de mon Radar immobilier :";
  }
  if (navigator.share) {
    try { await navigator.share({title: titre, text: texte, url: e.lien}); }
    catch (err) {
      e.avis = err && err.name === "AbortError" ? "Envoi annulé : tu peux copier le lien ci-dessous."
        : "Le menu de partage a échoué (" + (err && err.name || "erreur") + ") : copie le lien ci-dessous.";
    }
  } else {
    try { await navigator.clipboard.writeText(texte + " " + e.lien); e.avis = "Message et lien copiés : colle-les où tu veux."; }
    catch (err) { e.avis = "Copie le lien ci-dessous."; }
  }
  if (ps === e) majPartage();
  await travail;
}

// ---------------------------------------------------------------- mode invité (lien …/radar/?p=CODE)
async function chargerInvite() {
  document.body.classList.add("invite");
  $("btn-connexion").hidden = true; $("btn-autre-compte").hidden = true;
  $("sous-titre").textContent = "Fiches partagées";
  if (!URL_SCRIPT_PARTAGE) { message("Ce partage n'est pas encore en service."); return; }
  message("Ouverture des fiches partagées…");
  let r;
  try { r = await (await fetch(URL_SCRIPT_PARTAGE + "?p=" + encodeURIComponent(INVITE))).json(); }
  catch (e) { message("Les fiches n'ont pas pu être lues (réseau). Recharge la page dans un instant."); return; }
  if (!r || !r.ok) {
    message({lien_inconnu: "Ce lien de partage n'existe pas. Vérifie qu'il a été copié au complet.",
             lien_coupe: "Ce lien de partage a été désactivé par la personne qui te l'a envoyé.",
             lien_invalide: "Ce lien de partage est incomplet."}[r && r.erreur] || "Les fiches n'ont pas pu être lues. Recharge la page dans un instant.");
    return;
  }
  donnees = {format: r.format, genere_le: r.genere_le, immeubles: r.fiches || []};
  journal = null;
  afficher();
  notesEtat = "invite";
}
async function telechargerCruncherInvite(b) {
  const id = b.dataset.crInvite, avant = b.textContent;
  b.disabled = true; b.textContent = "Préparation…";
  try {
    const r = await (await fetch(URL_SCRIPT_PARTAGE + "?p=" + encodeURIComponent(INVITE) + "&cr=" + encodeURIComponent(id))).json();
    if (!r || !r.ok) throw new Error();
    const brut = atob(r.base64), o = new Uint8Array(brut.length);
    for (let i = 0; i < brut.length; i++) o[i] = brut.charCodeAt(i);
    telechargerFichier(new File([o], nomSur(r.nom || "Cruncher.xlsm"), {type: r.type || "application/vnd.ms-excel.sheet.macroEnabled.12"}));
    b.textContent = "Téléchargé ✓";
  } catch (e) { b.textContent = "Échec — réessayer"; }
  b.disabled = false; setTimeout(() => { b.textContent = avant; }, 4000);
}

// ---- Pastille « Dernier run » = dernier passage de la collecte (bêta 0.22, étape 8 du plan)
const SEUIL_JAUNE_MIN = 180;                 // plus de 3 h de jour sans passage = jaune
const JOUR_DEBUT = 6, JOUR_FIN = 23;         // plage de jour de la collecte (feuille Radar_Reglages), heure de Montréal
const heureMtl = (d) => Number(d.toLocaleString("en-CA", {timeZone: "America/Toronto", hour: "numeric", hourCycle: "h23"}));
// Minutes écoulées entre deux instants, sans compter la nuit (la collecte dort volontairement).
function minutesDeJour(debut, fin) {
  let n = 0;
  for (let t = debut.getTime(); t < fin.getTime() && n <= 24 * 60; t += 5 * 60000) {
    const h = heureMtl(new Date(t)); if (h >= JOUR_DEBUT && h < JOUR_FIN) n += 5;
  }
  return n;
}
const depuis = (min) => min < 1 ? "à l'instant" : min < 60 ? "il y a " + Math.round(min) + " min"
  : min < 48 * 60 ? "il y a " + Math.floor(min / 60) + " h" + (min % 60 >= 5 && min < 600 ? " " + String(Math.round(min % 60)).padStart(2, "0") : "")
  : "il y a " + Math.round(min / 1440) + " jours";
function majPastille() {
  const c = journal && journal.collecte, et = $("etat");
  if (!c || !c.date || !et) return;
  const d = new Date(c.date), maintenant = new Date();
  if (isNaN(d)) return;
  const echec = c.conclusion !== "success";
  const jaune = !echec && minutesDeJour(d, maintenant) > SEUIL_JAUNE_MIN;
  const heure = d.toLocaleTimeString("fr-CA", {hour: "2-digit", minute: "2-digit"});
  et.className = "etat " + (echec ? "ko" : jaune ? "av" : "ok");
  et.title = (echec ? "Le dernier passage de la collecte a échoué (" + (c.conclusion || "?") + ")"
    : jaune ? "Aucun passage de la collecte depuis plus de 3 h de jour : quelque chose bloque peut-être"
    : "Dernier passage de la collecte réussi") + " — " + dateHeure(c.date) + ". Toucher pour ouvrir le journal.";
  et.innerHTML = "● " + (echec ? "Collecte en échec · " + esc(heure) : "Collecte · " + depuis((maintenant - d) / 60000));
}
setInterval(majPastille, 60000);             // l'âge affiché avance tout seul

function afficherJournal() {
  const runs = (journal && journal.runs) || [], passages = (journal && journal.passages) || [];
  const lien = (u) => u && /^https:\/\/github\.com\//.test(u) ? ` · <a href="${esc(u)}" target="_blank" rel="noopener">GitHub</a>` : "";
  const blocPassages = passages.length ? "<h3>Passages de la collecte</h3>" + passages.slice(0, 10).map((p) =>
    `<div class="passage${p.conclusion !== "success" ? " ko" : ""}">${dateHeure(p.date)} · ${p.conclusion === "success" ? "réussi" : "⚠ échec"} · passage ${esc(p.run)}${lien(p.lien)}</div>`).join("")
    + "<h3 style=\"margin-top:14px\">Analyses d'immeubles</h3>" : "";
  $("journal").innerHTML = blocPassages + (runs.length ? runs.slice(0, 20).map((r) =>
    `<div class="run"><b>Run ${esc(r.run)}</b> · ${dateHeure(r.date)} · ${r.probleme ? "⚠ problème" : esc(r.conclusion || "")}
     ${r.lien && /^https:\/\/github\.com\//.test(r.lien) ? ` · <a href="${esc(r.lien)}" target="_blank" rel="noopener">GitHub</a>` : ""}
     <pre>${esc((r.rapport || []).join("\n"))}</pre></div>`).join("") : "Aucun run inscrit au journal.");
}

// ---------------------------------------------------------------- événements
// Notes : chaque frappe est gardée tout de suite dans le navigateur, puis envoyée à Google après une courte pause.
$("grille").addEventListener("input", (e) => {
  const z = e.target; if (!z.dataset || z.dataset.note === undefined) return;
  const id = z.dataset.note, s = saisies[id] || (saisies[id] = {note: "", modifie: "", etape: ""});
  if (!noteSale[id]) s.base = s.note;
  s.note = z.value; noteSale[id] = true; poserBrouillon(id, z.value, s.base);
  noteMsg[id] = {txt: "…"}; majEtatNote(id); ajusterNote(z); planifierNote(id);
});
$("grille").addEventListener("focusout", (e) => { const z = e.target; if (z.dataset && z.dataset.note !== undefined && noteSale[z.dataset.note]) enregistrerNote(z.dataset.note); });
$("btn-notes").addEventListener("click", async () => {
  if (notesEtat === "sans-droit") { try { await demanderJeton(false); } catch (e) { return; } }
  notesEtat = "attente"; majNotes(); chargerNotes();
});
// Au retour sur la page : on relit les notes (elles ont pu être écrites sur un autre appareil).
document.addEventListener("visibilitychange", () => {
  if (document.hidden) Object.keys(noteMinut).forEach(enregistrerNote);
  else if (donnees && jeton && notesEtat === "pret") chargerNotes();
});
// Mise à jour automatique (bêta 0.23, décision de François du 14 oct. 2026) : au retour sur l'onglet, la page
// relit sa propre version en ligne ; si le numéro (bêta X.YY) a changé, elle se recharge seule. Jamais pendant
// une frappe : elle attend que la zone de notes soit quittée et que les notes soient enregistrées.
const MA_VERSION = (document.querySelector("h1 .ver") || {}).textContent || "";
let derniereVerif = 0, rechargePrevue = false;
const enFrappe = () => { const a = document.activeElement; return !!(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")); };
async function verifierVersion() {
  if (rechargePrevue || !MA_VERSION || Date.now() - derniereVerif < 60000) return;
  derniereVerif = Date.now();
  try {
    const r = await fetch(location.pathname + "?v=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return;
    const m = (await r.text()).match(/class="ver"[^>]*>([^<]+)</);
    if (m && m[1].trim() && m[1].trim() !== MA_VERSION.trim()) { rechargePrevue = true; rechargerQuandPret(); }
  } catch (e) { /* hors ligne : on réessaiera au prochain retour */ }
}
async function rechargerQuandPret() {
  if (enFrappe()) { document.addEventListener("focusout", () => setTimeout(rechargerQuandPret, 300), {once: true}); return; }
  Object.keys(noteMinut).forEach(enregistrerNote);
  try { await fileNotes; } catch (e) {}
  location.reload();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) verifierVersion(); });
window.addEventListener("focus", verifierVersion);

$("btn-connexion").addEventListener("click", () => (jeton ? charger() : connecter()));
$("btn-autre-compte").addEventListener("click", () => { oublierJeton(); memoriserCompte(""); connecter(true); });
document.addEventListener("click", renouveler, true);
document.addEventListener("visibilitychange", () => { if (!document.hidden) planifierRenouvellement(); });
$("tri").addEventListener("change", afficherCartes);
$("kpis").addEventListener("click", (e) => { const b = e.target.closest && e.target.closest("[data-filtre]"); if (b) choisirFiltre(b.dataset.filtre); });
$("btn-secteur").addEventListener("click", () => ouvrirSecteurs($("liste-secteur").hidden));
$("liste-secteur").addEventListener("change", (e) => {
  const c = e.target; if (!c.dataset || c.dataset.secteur === undefined) return;
  if (!c.dataset.secteur) secteursChoisis.clear();
  else if (c.checked) secteursChoisis.add(c.dataset.secteur); else secteursChoisis.delete(c.dataset.secteur);
  majSecteurs(); afficherCartes();
});
$("liste-secteur").addEventListener("click", (e) => { if (e.target.id === "fermer-secteur") ouvrirSecteurs(false); });
document.addEventListener("click", (e) => { if (!$("liste-secteur").hidden && !e.target.closest("#secteur")) ouvrirSecteurs(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("liste-secteur").hidden) { ouvrirSecteurs(false); $("btn-secteur").focus(); } });
$("grille").addEventListener("change", (e) => { const s = e.target; if (s.dataset && s.dataset.etape !== undefined && s.matches("select")) choisirEtape(s.dataset.etape, s.value); });
// Partager (en-tête) : une sélection, toutes les fiches affichées cochées. Tant que le script n'est pas publié :
// l'ancien comportement (aperçu figé).
$("btn-partager").addEventListener("click", async () => {
  if (URL_SCRIPT_PARTAGE && donnees) { ouvrirPartage(null, "sel"); return; }
  const dire = (t) => { $("txt-partager").textContent = t; setTimeout(() => { $("txt-partager").textContent = "Partager"; }, 2500); };
  if (navigator.share) {
    try { await navigator.share({title: "Radar immobilier", text: "Aperçu de mon Radar immobilier", url: LIEN_PARTAGE}); }
    catch (e) { if (e && e.name !== "AbortError") dire("Échec"); }
    return;
  }
  try { await navigator.clipboard.writeText(LIEN_PARTAGE); dire("Lien copié"); } catch (e) { dire("Échec"); }
});
// Partager une fiche (bouton de chaque carte) ; Cruncher de l'invité.
$("grille").addEventListener("click", (e) => {
  const c = e.target.closest && e.target.closest("[data-cr-invite]");
  if (c) { telechargerCruncherInvite(c); return; }
  const b = e.target.closest && e.target.closest("[data-partager]");
  if (!b) return;
  const im = ficheParId(b.dataset.partager);
  if (im) ouvrirPartage(im, "un");
});
$("pp-m-un").addEventListener("click", () => { if (ps && !ps.envoye) { ps.mode = "un"; majPartage(); } });
$("pp-m-sel").addEventListener("click", () => { if (ps && !ps.envoye) { ps.mode = "sel"; majPartage(); } });
$("pp-liste").addEventListener("change", (e) => {
  const c = e.target; if (!ps || !c.dataset || c.dataset.choix === undefined) return;
  if (c.checked) ps.choisis.add(c.dataset.choix); else ps.choisis.delete(c.dataset.choix);
  majPartage();
});
$("pp-tout").addEventListener("click", () => { if (ps && !ps.envoye) { fichesAffichees().forEach((i) => i.id && ps.choisis.add(String(i.id))); majPartage(); } });
$("pp-rien").addEventListener("click", () => { if (ps && !ps.envoye) { ps.choisis.clear(); majPartage(); } });
$("pp-envoyer").addEventListener("click", envoyerPartage);
$("pp-reessayer").addEventListener("click", () => { if (ps && ps.envoye && !ps.ecrit) ecrireEtPreparer(ps); });
$("pp-annuler").addEventListener("click", fermerPartage);
$("pp").addEventListener("cancel", () => { ps = null; });
const basculerJournal = () => { $("panneau-journal").hidden = !$("panneau-journal").hidden; };
$("etat").addEventListener("click", basculerJournal);
// La petite carte Google Maps ne se charge qu'à l'ouverture du détail.
document.addEventListener("toggle", (e) => {
  const f = e.target.open && e.target.querySelector && e.target.querySelector("iframe[data-src]");
  if (f) { f.src = f.dataset.src; f.removeAttribute("data-src"); }
}, true);

if (INVITE) { document.querySelector("h1 .inv").hidden = false; chargerInvite(); }
else if ((jeton = lireJetonMemorise())) { planifierRenouvellement(); charger(); if (compteMemorise()) chargerGIS().catch(() => {}); }
else if (CLIENT_ID && compteMemorise()) {
  // Retour après expiration : un essai sans clic (réussit si le navigateur laisse passer la fenêtre), sinon un bouton.
  ecranConnexion("Session expirée. Un toucher suffit pour revenir.");
  demanderJeton(true).then(charger, () => {});
}
else if (!CLIENT_ID) message("Portail pas encore relié à Google : l'identifiant client OAuth reste à installer (voir la fiche du chantier).");
</script>
